server:
  port: 8096

spring:
  application:
    name: dcp-outlet-worker

outlet:
  # 控制面服务(收指令 / 报心跳 / 续租约 / **拉契约视图**)
  control:
    url: ${OUTLET_CONTROL_URL:http://127.0.0.1:8095}
  # 出口栈 Kafka(与平台 kafka:9092 不是一套;19092 是出口栈)
  kafka:
    bootstrap: ${OUTLET_KAFKA_BOOTSTRAP:127.0.0.1:19092}
  # 逻辑仓库根目录:布局 <root>/<logicId>/<version>.jar(+ 同名 .sha256 sidecar)
  logic:
    repo: ${OUTLET_LOGIC_REPO:./logic-repo}
  # 契约视图拉取:刷新周期 = 权限收窄/吊销的生效上界(默认 30s,与设计一致)
  contract:
    refresh-ms: ${OUTLET_CONTRACT_REFRESH_MS:30000}
    timeout-ms: ${OUTLET_CONTRACT_TIMEOUT_MS:3000}

logging:
  level:
    root: INFO
    com.dcp.outlet: INFO
