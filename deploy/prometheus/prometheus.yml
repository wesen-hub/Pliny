# ============================================================================
# 变更流出口 · Prometheus 抓取配置(2026-09-14)
#
# 设计口径:栈指标由后端 OutletStackCollector 定时采集(TiCDC / TiDB GC / Kafka ISR),
# 注册为 chg_* Gauge;业务指标(outlet_*)由埋点在批作业/SDK/快照任务路径上打点。
# → 因此 **Prometheus 只抓后端一个 target**,不给 monitor-outlet-stack.sh 写 exporter。
#
# target 说明:Prometheus 与 backend 同处外部网络 data-collect-platform_default,
# 走服务名 backend:8080(容器内端口),不是宿主 8081。
#
# M5(2026-10-07)扩展: 治理层监控——抓取全部 7 个控制面服务:
#   - 6 个业务服务统一暴露 /api/actuator/prometheus(与网关白名单 ANY:/api/actuator/** 对齐)
#   - dcp-gateway 自身 actuator 保持默认 /actuator(base-path 若设 /api/actuator
#     会与 Path=/api/** 兜底路由冲突, 请求被转发到 backend)
#   - 全部走容器网络服务名直连, 不经网关(JWT 不拦)
# ============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: dcp-outlet
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

# 指标长期持久化: remote_write 到 VictoriaMetrics(本地 TSDB 仅短期热数据, 长期由 VM 保留 90d)
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 10000
      capacity: 20000

scrape_configs:
  # ---------------------------------------------------------------- 出口后端(唯一 target)
  - job_name: dcp-outlet-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: dcp-backend
          component: outlet

  # ---------------------------------------------------------------- M5: 治理层其余 5 个业务服务
  - job_name: dcp-services
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets:
          - "outlet-service:8095"        # 注册名 dcp-outlet-control
          - "delivery-service:8096"
          - "subscription-service:8098"
          - "asset-service:8099"
          - "tagengine-service:8100"

  # ---------------------------------------------------------------- M5: 网关(默认 /actuator)
  - job_name: dcp-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dcp-gateway:8088"]
        labels:
          service: dcp-gateway
