# SeaTunnel Zeta 集群引擎配置(三机)
# checkpoint 存 MinIO S3(4 节点分布式): 节点宕机后作业在其余节点从最近 checkpoint 恢复
seatunnel:
  engine:
    classloader-cache-mode: true
    history-job-expire-minutes: 1440
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 60
    print-job-metrics-info-interval: 60
    job-metrics-backup-interval: 1
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 10000
      timeout: 60000
      storage:
        # type 是 CheckpointStorageFactory 的 factoryIdentifier(SPI 按此匹配): 只有 hdfs / localfile
        # S3 存储走 HdfsStorageFactory(factoryIdentifier=hdfs), 由 plugin-config.storage.type 内部分派
        type: hdfs
        max-retained: 3
        plugin-config:
          storage.type: s3
          # bucket 值必须带 s3a:// 前缀: 否则走 s3n(NativeS3FileSystem, hadoop3 已废弃且不支持 endpoint 配置)
          s3.bucket: s3a://seatunnel-checkpoint
          namespace: seatunnel/checkpoint/
          fs.s3a.endpoint: http://10.66.0.2:9000
          fs.s3a.access.key: minioadmin
          fs.s3a.secret.key: minioadmin123
          fs.s3a.path.style.access: true
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: true
    http:
      enable-http: true
      port: 8081
      enable-dynamic-port: false

hazelcast:
  cluster-name: seatunnel
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        CLUSTER_WRITE:
          enabled: true
        DATA:
          enabled: true
    join:
      tcp-ip:
        enabled: true
        member-list:
          - mac.wg:5801
          - 10.66.0.2:5801
          - 10.66.0.3:5801
    port:
      auto-increment: false
      port: 5801
      port-count: 100
  properties:
    hazelcast.logging.type: log4j2
