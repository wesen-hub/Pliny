# DCP 平台共享配置(部署时发布到 Nacos namespace=dcp, dataId=dcp-common.yml)
# 所有服务 spring.config.import 引入; 发布方式: scripts/import-nacos-config.sh(OpenAPI v2, 幂等覆盖)
#
# 优先级机制(Spring Boot 标准 ConfigData 顺序, 高→低):
#   环境变量 > 本地 application.yml > nacos import
# ⇒ 服务 yml 中已有 ${ENV:default} 占位符的 key, Nacos 无法覆盖, 部署时请用环境变量注入;
#   本文件只承载「各服务 yml 中不存在的 key」, 未定义该 key 的服务接入后直接生效。

# ── 统一调度框架 etcd ──
# dcp-worker 的 yml 已有 DCP_ETCD 占位符(以其 yml/环境变量为准);
# 其余服务若接入框架调度(client 直读 dcp.etcd.endpoints)则取本值。
dcp:
  etcd:
    endpoints: http://dcp-etcd:2379

# ── MinIO 对象存储 ──
# M7: outlet-service LogicService 迁共享桶 jar-release 读此段(该服务 yml 未定义 minio.*);
# dcp-worker 的 dcp.worker.minio.* 走其 yml 占位符, 与此独立。
minio:
  endpoint: http://dcp-minio:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: jar-release

# ── 管理面 JWT ──
# 不在此承载: backend/subscription/tagengine/asset 的 yml 均有 ${JWT_SECRET} 占位符
# (SecurityKeyGuard 校验 ≥32 字节, 缺失即启动失败), M2 dcp-gateway 验签同源;
# 全服务统一由环境变量 JWT_SECRET 注入(compose 已强制要求), 避免多来源不一致。
