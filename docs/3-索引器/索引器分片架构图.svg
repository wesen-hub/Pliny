<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2d6cdf"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#10a37f"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect x="0" y="0" width="1240" height="820" fill="#f8fafc"/>

  <!-- ================= 标题 ================= -->
  <text x="620" y="40" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">索引器水平分片架构(Kafka 消费组自治)</text>

  <!-- ================= 数据生产 ================= -->
  <rect x="40" y="80" width="220" height="64" rx="8" fill="#e0eaff" stroke="#2d6cdf" stroke-width="1.5"/>
  <text x="150" y="108" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">数据生产</text>
  <text x="150" y="130" font-size="12" fill="#1e40af" text-anchor="middle">SeaTunnel CDC / TiCDC</text>

  <!-- ================= Kafka ================= -->
  <rect x="40" y="210" width="280" height="330" rx="8" fill="#ffffff" stroke="#2d6cdf" stroke-width="1.5"/>
  <text x="180" y="236" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Kafka(dcp.cdc.* 主题)</text>

  <!-- topic A -->
  <text x="60" y="270" font-size="11" fill="#475569">orders</text>
  <rect x="115" y="258" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="138" y="273" font-size="10" fill="#1e40af" text-anchor="middle">p0</text>
  <rect x="167" y="258" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="190" y="273" font-size="10" fill="#1e40af" text-anchor="middle">p1</text>
  <rect x="219" y="258" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="242" y="273" font-size="10" fill="#1e40af" text-anchor="middle">p2</text>
  <!-- topic B -->
  <text x="60" y="330" font-size="11" fill="#475569">users</text>
  <rect x="115" y="318" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="138" y="333" font-size="10" fill="#1e40af" text-anchor="middle">p0</text>
  <rect x="167" y="318" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="190" y="333" font-size="10" fill="#1e40af" text-anchor="middle">p1</text>
  <rect x="219" y="318" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="242" y="333" font-size="10" fill="#1e40af" text-anchor="middle">p2</text>
  <!-- topic C -->
  <text x="60" y="390" font-size="11" fill="#475569">payments</text>
  <rect x="115" y="378" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="138" y="393" font-size="10" fill="#1e40af" text-anchor="middle">p0</text>
  <rect x="167" y="378" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="190" y="393" font-size="10" fill="#1e40af" text-anchor="middle">p1</text>
  <rect x="219" y="378" width="46" height="22" rx="4" fill="#dbeafe" stroke="#2d6cdf"/>
  <text x="242" y="393" font-size="10" fill="#1e40af" text-anchor="middle">p2</text>

  <text x="60" y="440" font-size="11" fill="#475569">… 更多主题(正则订阅,新表自动纳入)</text>
  <text x="60" y="512" font-size="11" fill="#475569">offset 提交 →</text>
  <rect x="150" y="500" width="150" height="22" rx="4" fill="#e0eaff" stroke="#2d6cdf"/>
  <text x="225" y="515" font-size="10" fill="#1e40af" text-anchor="middle">__consumer_offsets</text>

  <!-- ================= 索引器消费组 ================= -->
  <rect x="380" y="80" width="580" height="520" rx="10" fill="none" stroke="#10a37f" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="670" y="106" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">索引器消费组 indexer-group(static membership + cooperative assignor)</text>

  <!-- 实例 A -->
  <rect x="405" y="125" width="530" height="135" rx="8" fill="#f0fdf4" stroke="#10a37f" stroke-width="1.5"/>
  <text x="420" y="148" font-size="13" font-weight="bold" fill="#047857">indexer-A(持有 4 分区)</text>
  <rect x="420" y="160" width="150" height="50" rx="6" fill="#dcfce7" stroke="#10a37f"/>
  <text x="495" y="182" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">poll 线程</text>
  <text x="495" y="199" font-size="10" fill="#047857" text-anchor="middle">唯一持有 KafkaConsumer</text>
  <text x="585" y="176" font-size="11" fill="#334155">按分区路由 →</text>
  <rect x="660" y="160" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="690" y="182" font-size="10" fill="#047857" text-anchor="middle">线程 p0</text>
  <text x="690" y="197" font-size="9" fill="#64748b" text-anchor="middle">orders-0</text>
  <rect x="728" y="160" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="758" y="182" font-size="10" fill="#047857" text-anchor="middle">线程 p1</text>
  <text x="758" y="197" font-size="9" fill="#64748b" text-anchor="middle">orders-1</text>
  <rect x="796" y="160" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="826" y="182" font-size="10" fill="#047857" text-anchor="middle">线程 p2</text>
  <text x="826" y="197" font-size="9" fill="#64748b" text-anchor="middle">users-0</text>
  <rect x="864" y="160" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="894" y="182" font-size="10" fill="#047857" text-anchor="middle">线程 p3</text>
  <text x="894" y="197" font-size="9" fill="#64748b" text-anchor="middle">users-1</text>
  <text x="420" y="240" font-size="10" fill="#475569">每线程串行:解析 → 更新分区级 lastMax → 刷新点判定 → 稀疏采样(每 10s 一个栅栏点)</text>

  <!-- 实例 B -->
  <rect x="405" y="275" width="530" height="135" rx="8" fill="#f0fdf4" stroke="#10a37f" stroke-width="1.5"/>
  <text x="420" y="298" font-size="13" font-weight="bold" fill="#047857">indexer-B(持有 4 分区)</text>
  <rect x="420" y="310" width="150" height="50" rx="6" fill="#dcfce7" stroke="#10a37f"/>
  <text x="495" y="332" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">poll 线程</text>
  <text x="495" y="349" font-size="10" fill="#047857" text-anchor="middle">唯一持有 KafkaConsumer</text>
  <text x="585" y="326" font-size="11" fill="#334155">按分区路由 →</text>
  <rect x="660" y="310" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="690" y="332" font-size="10" fill="#047857" text-anchor="middle">线程 p0</text>
  <text x="690" y="347" font-size="9" fill="#64748b" text-anchor="middle">users-2</text>
  <rect x="728" y="310" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="758" y="332" font-size="10" fill="#047857" text-anchor="middle">线程 p1</text>
  <text x="758" y="347" font-size="9" fill="#64748b" text-anchor="middle">pay-0</text>
  <rect x="796" y="310" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="826" y="332" font-size="10" fill="#047857" text-anchor="middle">线程 p2</text>
  <text x="826" y="347" font-size="9" fill="#64748b" text-anchor="middle">pay-1</text>
  <rect x="864" y="310" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="894" y="332" font-size="10" fill="#047857" text-anchor="middle">线程 p3</text>
  <text x="894" y="347" font-size="9" fill="#64748b" text-anchor="middle">pay-2</text>
  <text x="420" y="390" font-size="10" fill="#475569">宕机 → 心跳超时 → Kafka 自动 rebalance → 分区转移,秒级完成(无需控制面)</text>

  <!-- 实例 C -->
  <rect x="405" y="425" width="530" height="135" rx="8" fill="#f0fdf4" stroke="#10a37f" stroke-width="1.5"/>
  <text x="420" y="448" font-size="13" font-weight="bold" fill="#047857">indexer-C(持有 4 分区)</text>
  <rect x="420" y="460" width="150" height="50" rx="6" fill="#dcfce7" stroke="#10a37f"/>
  <text x="495" y="482" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">poll 线程</text>
  <text x="495" y="499" font-size="10" fill="#047857" text-anchor="middle">唯一持有 KafkaConsumer</text>
  <text x="585" y="476" font-size="11" fill="#334155">按分区路由 →</text>
  <rect x="660" y="460" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="690" y="482" font-size="10" fill="#047857" text-anchor="middle">线程 p0</text>
  <text x="690" y="497" font-size="9" fill="#64748b" text-anchor="middle">…</text>
  <rect x="728" y="460" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="758" y="482" font-size="10" fill="#047857" text-anchor="middle">线程 p1</text>
  <text x="758" y="497" font-size="9" fill="#64748b" text-anchor="middle">…</text>
  <rect x="796" y="460" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="826" y="482" font-size="10" fill="#047857" text-anchor="middle">线程 p2</text>
  <text x="826" y="497" font-size="9" fill="#64748b" text-anchor="middle">…</text>
  <rect x="864" y="460" width="60" height="50" rx="6" fill="#ffffff" stroke="#10a37f"/>
  <text x="894" y="482" font-size="10" fill="#047857" text-anchor="middle">线程 p3</text>
  <text x="894" y="497" font-size="9" fill="#64748b" text-anchor="middle">…</text>
  <text x="420" y="540" font-size="10" fill="#475569">扩容 = 新实例入组 rebalance 自动接管;实例数 ≤ 总分区数(超出空转)</text>

  <text x="670" y="580" font-size="11" fill="#047857" text-anchor="middle">分区间零共享、无锁并行;分区内严格按 offset 序单线程(正确性前提)</text>

  <!-- ================= 状态存储 ================= -->
  <rect x="1010" y="125" width="205" height="150" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="1112" y="150" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">元数据库(TiDB)</text>
  <rect x="1024" y="162" width="178" height="44" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="1113" y="181" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">chg_anchor 锚点表</text>
  <text x="1113" y="197" font-size="9" fill="#9a3412" text-anchor="middle">栅栏点(刷新点稀疏采样)</text>
  <rect x="1024" y="214" width="178" height="44" rx="6" fill="#ffedd5" stroke="#d97706"/>
  <text x="1113" y="233" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">taint 污染表(前置条件)</text>
  <text x="1113" y="249" font-size="9" fill="#9a3412" text-anchor="middle">(topic, partition) 污染标记落库</text>

  <!-- ================= 消费底座 ================= -->
  <rect x="1010" y="330" width="205" height="150" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1112" y="355" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">消费底座(控制面)</text>
  <rect x="1024" y="368" width="178" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="1113" y="387" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">起点计算</text>
  <text x="1113" y="403" font-size="9" fill="#64748b" text-anchor="middle">lastFenceAtOrBefore(纯索引查询)</text>
  <rect x="1024" y="420" width="178" height="44" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="1113" y="439" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">单元规划 / 下发</text>
  <text x="1113" y="455" font-size="9" fill="#64748b" text-anchor="middle">批流衔接播种(独立子系统)</text>

  <!-- ================= 连线 ================= -->
  <!-- 生产 → Kafka -->
  <line x1="150" y1="144" x2="180" y2="208" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- Kafka → 索引器组 -->
  <line x1="320" y1="330" x2="378" y2="330" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="332" y="318" font-size="10" fill="#1e40af" text-anchor="middle">分区自动分配</text>
  <!-- Kafka __consumer_offsets 回指 -->
  <line x1="300" y1="511" x2="376" y2="520" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <!-- 索引器 → 锚点表 -->
  <line x1="935" y1="180" x2="1008" y2="180" stroke="#d97706" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="955" y="170" font-size="10" fill="#9a3412" text-anchor="middle">稀疏采样入库</text>
  <!-- 索引器 → 污染表 -->
  <line x1="935" y1="236" x2="1008" y2="236" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="960" y="228" font-size="10" fill="#dc2626" text-anchor="middle">C1 解析失败污染 + 告警</text>
  <!-- 锚点表 → 起点计算 -->
  <line x1="1010" y1="192" x2="1010" y2="345" stroke="#64748b" stroke-width="0" />
  <path d="M 1010 192 L 1010 205 L 1222 205 L 1222 386" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="1150" y="198" font-size="10" fill="#64748b" text-anchor="middle">查询 ts ≤ T0 的最大栅栏</text>
  <!-- 污染表 → 索引器(接管恢复) -->
  <path d="M 1010 236 L 1010 300 L 998 300 L 940 300" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="962" y="294" font-size="10" fill="#64748b" text-anchor="middle">接管时查 taint 恢复</text>
  <!-- 索引器 → 锚点表(恢复读) -->
  <path d="M 940 470 L 990 470 L 990 236 L 1008 236" fill="none" stroke="#10a37f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGreen)"/>
  <text x="978" y="350" font-size="10" fill="#047857" text-anchor="middle" transform="rotate(-90 978 350)">接管时读锚点重建 lastMax</text>

  <!-- ================= 图例 ================= -->
  <rect x="40" y="600" width="1240" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="628" font-size="13" font-weight="bold" fill="#0f172a">图例与关键设计点</text>
  <line x1="60" y1="652" x2="110" y2="652" stroke="#2d6cdf" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="118" y="656" font-size="11" fill="#334155">数据流 / 分区分配</text>
  <line x1="280" y1="652" x2="330" y2="652" stroke="#d97706" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="338" y="656" font-size="11" fill="#334155">状态写入(锚点)</text>
  <line x1="470" y1="652" x2="520" y2="652" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="528" y="656" font-size="11" fill="#334155">污染(C1)</text>
  <line x1="620" y1="652" x2="670" y2="652" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="678" y="656" font-size="11" fill="#334155">查询 / 状态恢复</text>

  <text x="60" y="686" font-size="11" fill="#334155">① 分片单元 = Kafka 分区:全部可变状态(lastMax / 栅栏点 / 污染)都是 (topic, partition) 级,跨分区零共享</text>
  <text x="60" y="708" font-size="11" fill="#334155">② 分片管理 = 消费组自治:分区自动分配 + rebalance 故障转移,不需要控制面下发、不需要租约防双(重复消费无害)</text>
  <text x="60" y="730" font-size="11" fill="#334155">③ 实例内 = 1 poll 线程 + N 处理线程(N = 持有分区数,随 rebalance 动态增减);分区内严格按 offset 序单线程</text>
  <text x="60" y="752" font-size="11" fill="#334155">④ 状态恢复 = 锚点表重建 lastMax + taint 落库前置;offset 由 __consumer_offsets 承担(处理完一批就交,污染也交)</text>
  <text x="60" y="774" font-size="11" fill="#334155">⑤ 与计算面单元双轨制:重复消费代价决定控制强度 —— 索引器(无害→轻) vs 计算面单元(重复投递→租约+防双+控制面下发)</text>
</svg>
