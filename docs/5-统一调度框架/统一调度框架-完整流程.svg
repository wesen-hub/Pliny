<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1040" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1240" height="1040" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">统一调度框架 · 完整流程架构图</text>
  <text x="40" y="70" font-size="13" fill="#64748b">业务外壳提交契约 → 调度主打分(CAS)→ 实例 watch 对账起停线程 → 执行器消费上报 → 监控/扩缩/迁移/注销 全流程闭环;换主对业务层透明</text>

  <!-- ═══ 运维后台 ═══ -->
  <rect x="40" y="84" width="1160" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="104" font-size="14" font-weight="700" fill="#0f172a">运维后台(管理面)</text>
  <text x="60" y="120" font-size="11.5" fill="#475569">ns 管理 · 任务管理 · 实例调配(下架/权重/暂停)· 分区迁移 · 监控大盘 · 扩缩触发 — 只触发与观察,决策权在框架+业务</text>

  <!-- ═══ 业务外壳 ═══ -->
  <rect x="40" y="160" width="300" height="300" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="188" font-size="14" font-weight="700" fill="#10b981">业务外壳(任务来源)</text>
  <g font-size="11.5" fill="#334155">
    <text x="60" y="212">· 组装/提交/更新/注销 TaskSpec</text>
    <text x="60" y="232">· sync:逻辑表保存 → 提交</text>
    <text x="60" y="252">· indexer:流扫描新 topic → 提交</text>
    <text x="60" y="272">· outlet:批打底 → 批流交接 T0</text>
    <text x="76" y="292">→ 单元规划 → 起点计算 → 提交</text>
    <text x="60" y="312">· Kafka 扩分区(收扩容建议)</text>
    <text x="60" y="332">· 可选 watch 自己任务 status</text>
  </g>
  <text x="60" y="372" font-size="11.5" font-weight="700" fill="#047857">① 写 spec + N 条 PENDING(提交即创建)</text>
  <text x="60" y="394" font-size="11.5" font-weight="700" fill="#64748b">⑨ 注销:删 spec → DRAINING → GONE</text>
  <text x="60" y="436" font-size="11" fill="#64748b">批流交接完整保留在外壳:框架不知道批阶段存在</text>

  <!-- ═══ etcd ═══ -->
  <rect x="372" y="160" width="496" height="300" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="392" y="188" font-size="14" font-weight="700" fill="#2563eb">etcd(唯一状态中心,业务只认它不认主)</text>
  <g font-size="11.5" fill="#334155">
    <rect x="392" y="200" width="456" height="34" rx="6" fill="#f1f5f9"/>
    <text x="404" y="221" font-family="monospace">/dcp/{ns}/leader</text>
    <text x="572" y="221" fill="#64748b">竞选键(lease campaign,每 ns 独立)</text>
    <rect x="392" y="238" width="456" height="34" rx="6" fill="#f1f5f9"/>
    <text x="404" y="259" font-family="monospace">/dcp/{ns}/instances/{id}</text>
    <text x="594" y="259" fill="#64748b">实例注册 + lease 30s(10s 续租)</text>
    <rect x="392" y="276" width="456" height="34" rx="6" fill="#eff6ff"/>
    <text x="404" y="297" font-family="monospace">/dcp/{ns}/tasks/{id}/spec</text>
    <text x="594" y="297" fill="#64748b">TaskSpec(外壳写,框架只读)</text>
    <rect x="392" y="314" width="456" height="34" rx="6" fill="#eff6ff"/>
    <text x="404" y="335" font-family="monospace">/dcp/{ns}/tasks/{id}/parts/{n}</text>
    <text x="612" y="335" fill="#64748b">分区归属(CAS+epoch,实例 watch)</text>
    <rect x="392" y="352" width="456" height="34" rx="6" fill="#f0fdf4"/>
    <text x="404" y="373" font-family="monospace">…/parts/{n}/snap</text>
    <text x="556" y="373" fill="#64748b">执行器快照(10s 续写,TTL 30s)</text>
    <rect x="392" y="390" width="456" height="34" rx="6" fill="#f1f5f9"/>
    <text x="404" y="411" font-family="monospace">status · rules · ops</text>
    <text x="560" y="411" fill="#64748b">任务状态(主写)· 规则 · 运维指令</text>
  </g>
  <text x="392" y="448" font-size="11" fill="#64748b">写入方/读取方所有权表 = 换主安全的基础;归属键 = 防双消费的原子互斥根基</text>

  <!-- ═══ 调度主 ═══ -->
  <rect x="900" y="160" width="300" height="300" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="920" y="188" font-size="14" font-weight="700" fill="#b45309">调度主(每 ns 独立选主)</text>
  <text x="920" y="212" font-size="12" font-weight="700" fill="#92400e">决策循环(10s/轮):</text>
  <g font-size="11.5" fill="#78350f">
    <text x="920" y="232">① 扫 PENDING → 候选过滤 → 打分</text>
    <text x="920" y="252">② CAS 写归属 → ASSIGNED</text>
    <text x="920" y="272">③ 判死:lease 过期 + 快照失效(双窗口)</text>
    <text x="920" y="292">④ 再平衡:新实例/下架/失衡/人工</text>
    <text x="920" y="312">⑤ 扩缩容:水位 × 持续期 × 冷却</text>
    <text x="920" y="332">⑥ 派生指标:lag/rps/latency/errorRate</text>
    <text x="920" y="352">⑦ 活性检测 + 告警巡检</text>
  </g>
  <g font-size="11.5" font-weight="700">
    <text x="920" y="392" fill="#92400e">→ 写:CAS 归属 / status / 告警</text>
    <text x="920" y="414" fill="#92400e">← 读:spec / instances / parts / 快照 / ops</text>
  </g>
  <text x="920" y="448" font-size="11" fill="#64748b">主无内存态:决策先落 etcd,换主全量读恢复,业务无感</text>

  <!-- ═══ 实例 ×3 ═══ -->
  <g>
    <rect x="40" y="544" width="376" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="572" font-size="13.5" font-weight="700" fill="#0f172a">实例 sync-01</text>
    <rect x="60" y="584" width="336" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="76" y="606" font-size="12.5" font-weight="700" fill="#334155">实例骨架(框架代码)</text>
    <text x="76" y="626" font-size="11.5" fill="#475569">注册 + lease 保活 · watch 归属对账</text>
    <text x="76" y="646" font-size="11.5" fill="#475569">diff 新增 → start(ctx);消失 → stop()</text>
    <rect x="60" y="672" width="336" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="76" y="694" font-size="12.5" font-weight="700" fill="#2563eb">执行器(业务代码,零 etcd 依赖)</text>
    <text x="76" y="714" font-size="11.5" fill="#475569">poll → 业务处理 → 提交位点 → 快照计数</text>
  </g>
  <g>
    <rect x="432" y="544" width="376" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="452" y="572" font-size="13.5" font-weight="700" fill="#0f172a">实例 sync-02</text>
    <rect x="452" y="584" width="336" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="468" y="606" font-size="12.5" font-weight="700" fill="#334155">实例骨架</text>
    <text x="468" y="626" font-size="11.5" fill="#475569">注册 + lease 保活 · watch 归属对账</text>
    <text x="468" y="646" font-size="11.5" fill="#475569">对账 diff 驱动起/停执行器线程</text>
    <rect x="452" y="672" width="336" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="468" y="694" font-size="12.5" font-weight="700" fill="#2563eb">执行器(每分区一线程)</text>
    <text x="468" y="714" font-size="11.5" fill="#475569">poll → 业务处理 → 提交位点 → 快照上报</text>
  </g>
  <g>
    <rect x="824" y="544" width="376" height="210" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="844" y="572" font-size="13.5" font-weight="700" fill="#dc2626">实例 sync-03(失联 → 判死 → 重分配)</text>
    <rect x="844" y="584" width="336" height="80" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="860" y="606" font-size="12.5" font-weight="700" fill="#dc2626">实例骨架(失联)</text>
    <text x="860" y="626" font-size="11.5" fill="#475569">lease 30s 不续租 → 主发现失联</text>
    <text x="860" y="646" font-size="11.5" fill="#475569">其分区 → 判死(双窗口)→ 重分配</text>
    <rect x="844" y="672" width="336" height="66" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="860" y="694" font-size="12.5" font-weight="700" fill="#dc2626">执行器(已停)</text>
    <text x="860" y="714" font-size="11.5" fill="#475569">快照停更 → TTL 失效 → 迁移到活实例续跑</text>
  </g>

  <!-- ═══ 生命周期时间带 ═══ -->
  <rect x="40" y="790" width="1160" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="812" font-size="13" font-weight="700" fill="#0f172a">完整生命周期(八阶段)</text>
  <g>
    <rect x="60" y="826" width="130" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="72" y="845" font-size="11.5" fill="#0369a1">① 框架启动</text>
    <rect x="202" y="826" width="130" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="216" y="845" font-size="11.5" fill="#0369a1">② 任务创建</text>
    <rect x="344" y="826" width="130" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="356" y="845" font-size="11.5" fill="#0369a1">③ 调度决策</text>
    <rect x="486" y="826" width="130" height="30" rx="15" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="508" y="845" font-size="11.5" fill="#0369a1">④ 执行</text>
    <rect x="628" y="826" width="130" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/>
    <text x="638" y="845" font-size="11.5" fill="#047857">⑤ 稳态监控</text>
    <rect x="770" y="826" width="130" height="30" rx="15" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="776" y="845" font-size="11.5" fill="#b45309">⑥ 自动扩缩容</text>
    <rect x="912" y="826" width="130" height="30" rx="15" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="922" y="845" font-size="11.5" fill="#b91c1c">⑦ 故障迁移</text>
    <rect x="1054" y="826" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1066" y="845" font-size="11.5" fill="#475569">⑧ 任务注销</text>
  </g>

  <!-- ═══ 流程箭头 ═══ -->
  <!-- ① 外壳 → etcd:提交 TaskSpec + PENDING -->
  <path d="M340 240 H372" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <!-- ⑨ 外壳 → etcd:注销 -->
  <path d="M340 394 H372" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- ② 主 → etcd:CAS 写归属 -->
  <path d="M900 240 H868" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
  <!-- ⑥ 主 ← etcd:读快照/归属/实例状态 -->
  <path d="M868 392 H900" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>

  <!-- ⑦ 扩缩容:主 ↔ 外壳(顶部通道,不穿中部) -->
  <path d="M1050 160 V142 H190 V160" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="470" y="156" font-size="10.5" fill="#b45309">⑦ 扩容建议(Kafka 扩分区,外壳执行)/ 缩容钩子切路由(框架回调业务钩子)</text>

  <!-- ③⑤ etcd ↔ 实例:双向竖线(下行 watch 对账,上行快照·注册·lease) -->
  <line x1="228" y1="480" x2="228" y2="540" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="620" y1="480" x2="620" y2="540" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="1012" y1="480" x2="1012" y2="540" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="242" y="496" font-size="10.5" fill="#475569">③ watch 对账(归属变化)↓</text>
  <text x="600" y="530" font-size="10.5" fill="#2563eb">⑤ 快照·注册 ↑(10s)</text>

  <!-- ⑧ 故障:实例3 失联 → 主判死 → 重分配 -->
  <line x1="1140" y1="464" x2="1140" y2="540" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="1150" y="506" font-size="11" font-weight="700" fill="#dc2626">⑧</text>

  <!-- 后台与 etcd -->
  <path d="M620 128 V160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="630" y="148" font-size="11" fill="#64748b">管理操作(读写)</text>

  <!-- ═══ 图例 ═══ -->
  <rect x="40" y="890" width="1160" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="916" font-size="13.5" font-weight="700" fill="#0f172a">图例</text>
  <g font-size="11.5" fill="#475569">
    <line x1="60" y1="932" x2="100" y2="932" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="108" y="936">绿 = 业务外壳交互(① 提交 / watch 状态)</text>
    <line x1="360" y1="932" x2="400" y2="932" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="408" y="936">琥珀 = 调度主决策(② CAS 写 / 读状态)</text>
    <line x1="660" y1="932" x2="700" y2="932" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="708" y="936">灰 = 状态流(⑨ 注销 / 后台管理)</text>
    <line x1="920" y1="932" x2="960" y2="932" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
    <text x="968" y="936">蓝虚线 = 周期上报(⑤ 快照 10s,TTL 30s)</text>
    <line x1="60" y1="956" x2="100" y2="956" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
    <text x="108" y="960">红虚线 = 故障路径(⑧ 失联 → 判死 → 重分配)</text>
    <text x="360" y="960">琥珀虚线 = 主读(⑥ 快照/归属)· 扩容建议(⑦)</text>
    <text x="60" y="984" font-size="11" fill="#94a3b8">双向竖线 = 每实例一条通道:下行 watch 对账 + 上行快照/注册/lease;业务层只认 etcd 不认调度主(换主透明)</text>
    <text x="60" y="1002" font-size="11" fill="#94a3b8">实例 TTL 30s 内重启:lease 未过期 → 归属不变 → 按 etcd 归属对账恢复,不触发重分配</text>
  </g>
</svg>
