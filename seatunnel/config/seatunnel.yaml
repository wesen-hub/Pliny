# SeaTunnel Zeta 引擎配置（基于发行包默认, REST 端口改 8081, checkpoint 持久化到 MinIO S3 共享存储）
seatunnel:
  engine:
    classloader-cache-mode: true
    history-job-expire-minutes: 1440
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 60
    print-job-metrics-info-interval: 60
    job-metrics-backup-interval: 1
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 10000
      timeout: 60000
      storage:
        # S3(MinIO)共享存储 —— 判死迁移/HA 恢复前提(worker 宕机后在别机带 savepoint 重提续采)。
        # 实测教训(反编译取证): 外层 type 必须是 SPI factoryIdentifier "hdfs", 实际存储类型
        # 在 plugin-config.storage.type: s3 分派, 且 s3.bucket 必须 s3a:// 前缀(否则走已废弃
        # NativeS3FileSystem); 客户端 JVM 内存预算须 ≥1536m(768m 触发 cgroup OOM 杀客户端 exit 137)。
        type: hdfs
        max-retained: 3
        plugin-config:
          storage.type: s3
          s3.bucket: s3a://dcp-seatunnel-checkpoint
          fs.s3a.endpoint: http://dcp-minio:9000
          fs.s3a.access.key: minioadmin
          fs.s3a.secret.key: minioadmin123
          fs.s3a.path.style.access: true
          fs.s3a.connection.ssl.enabled: false
          fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
          fs.s3a.fast.upload.buffer: disk
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: true
    http:
      enable-http: true
      port: 8081
      enable-dynamic-port: false

hazelcast:
  cluster-name: seatunnel
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        CLUSTER_WRITE:
          enabled: true
        DATA:
          enabled: true
    join:
      tcp-ip:
        enabled: true
        member-list:
          - seatunnel:5801
    port:
      auto-increment: false
      port: 5801
      port-count: 100
  properties:
    hazelcast.logging.type: log4j2
