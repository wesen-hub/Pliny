# SeaTunnel Zeta 引擎配置（基于发行包默认, REST 端口改 8081, checkpoint 持久化到命名卷 seatunnel-checkpoint:/opt/checkpoint）
seatunnel:
  engine:
    classloader-cache-mode: true
    history-job-expire-minutes: 1440
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 60
    print-job-metrics-info-interval: 60
    job-metrics-backup-interval: 1
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 10000
      timeout: 60000
      storage:
        type: hdfs
        max-retained: 3
        plugin-config:
          namespace: /opt/checkpoint/checkpoint_snapshot
          storage.type: hdfs
          fs.defaultFS: file:///opt/checkpoint/ # 命名卷挂载(seatunnel-checkpoint), 容器重启不丢; 原 /tmp 为全量重发高危项
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: true
    http:
      enable-http: true
      port: 8081
      enable-dynamic-port: false

hazelcast:
  cluster-name: seatunnel
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        CLUSTER_WRITE:
          enabled: true
        DATA:
          enabled: true
    join:
      tcp-ip:
        enabled: true
        member-list:
          - seatunnel:5801
    port:
      auto-increment: false
      port: 5801
      port-count: 100
  properties:
    hazelcast.logging.type: log4j2
