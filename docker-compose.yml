# 数据采集平台 - Docker Compose 编排
# 服务: mysql(元数据库) + demo-db(演示源/目标库) + backend(Spring Boot) + frontend(Nginx)
# 启动: docker compose up -d --build
# 访问: http://localhost:8080   默认账号: admin / admin123
name: data-collect-platform

services:
  # 微服务治理: Nacos 注册中心(阶段 A; 本地 standalone, 集群部署见最小集群方案 3 节点)
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: dcp-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # M5: Prometheus 监控(治理层): 容器网络直连抓取 7 个服务指标(6 业务服务 /api/actuator/prometheus + 网关 /actuator/prometheus)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dcp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # M6: Zipkin 链路追踪(治理层): 内存存储, 9411 Web UI + /api/v2/spans 上报
  zipkin:
    image: openzipkin/zipkin:3
    container_name: dcp-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
      JAVA_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9411/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 微服务治理网关(阶段 A): 唯一 API 入口, lb:// 路由到各控制面服务
  dcp-gateway:
    build: ./dcp-gateway
    container_name: dcp-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"

  mysql:
    image: mysql:8.0
    container_name: dcp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      MYSQL_DATABASE: dcp
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # outlet 控制面 v2 元库表(consumer_task/consumer_unit/chg_anchor 等;IF NOT EXISTS 幂等)。
      # 存量 mysql-data 卷不会重跑 initdb, 需手工执行: docker exec -i dcp-mysql mysql -uroot -proot123 dcp < outlet/v2-meta-ddl.sql
      - ./outlet/v2-meta-ddl.sql:/docker-entrypoint-initdb.d/02_outlet_v2.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 演示用源库 + 目标库（数据采集平台的演示数据，业务系统模拟）
  demo-db:
    image: mysql:8.0
    container_name: dcp-demo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ./demo-db/init:/docker-entrypoint-initdb.d:ro
      - demo-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Kafka(V3 同步链路缓冲层; KRaft 单节点, 仅演示/开发)
  kafka:
    image: apache/kafka:3.7.0
    container_name: dcp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  # 出口栈 Kafka(outlet 链路专用, 19092; 与平台 kafka:9092 隔离, KRaft 单节点)
  outlet-kafka:
    image: apache/kafka:3.7.0
    container_name: dcp-outlet-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@outlet-kafka:19093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://outlet-kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      # 宿主机 19092 被 perm-kafka(权限项目)占用, 验证容器对外用 19094
      - "19094:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 演示 MongoDB 源库（数据采集平台的 MongoDB 演示源）
  mongo:
    image: mongo:7
    container_name: dcp-mongo
    restart: unless-stopped
    environment:
      # 演示环境: 单节点副本集(change stream 必需) + 无认证(副本集+认证需 keyFile, 演示从简)
      MONGO_INITDB_DATABASE: app_db
      TZ: Asia/Shanghai
    command: ["mongod", "--replSet", "rs0", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 演示 SQL Server 源库（CDC: 事务日志捕获, Debezium SqlServerConnector; 仅 amd64 镜像, Apple Silicon 走 Rosetta 模拟）
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest   # 2022 在 Rosetta 下有 VA 映射问题(Invalid mapping of address), 2019 可稳定运行
    platform: linux/amd64
    container_name: dcp-sqlserver
    restart: "no"   # Rosetta 下 mssql 无法启动(VA 映射), 需 x86_64 环境
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DcpDemo@123456"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"   # CDC 捕获作业依赖 SQL Server Agent
      TZ: Asia/Shanghai
    volumes:
      - ./demo-sqlserver/init:/init:ro
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DcpDemo@123456' -C -Q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s
    ulimits:
      # SQL Server 在 Rosetta 下 VA 映射错误("Invalid mapping of address ... below 0x400000000000")
      # 是 stack size unlimited 触发, 显式限制 stack 可规避
      stack: 8388608

  # 演示 Oracle 源库（CDC: 归档日志 + LogMiner; Oracle Free 23c 支持 arm64）
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: dcp-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: root123
      APP_USER: dcp
      APP_USER_PASSWORD: dcp123
      TZ: Asia/Shanghai
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  # 演示 PostgreSQL 源库（CDC: wal_level=logical, 逻辑复制 slot）
  postgres:
    image: postgres:16
    container_name: dcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: root123
      TZ: Asia/Shanghai
    command:
      - -c
      - wal_level=logical
    volumes:
      - ./demo-pg/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # MinIO 单节点(SeaTunnel checkpoint 共享存储; 生产为 MinIO×4 分布式集群)
  dcp-minio:
    image: minio/minio:latest
    container_name: dcp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # 初始化 SeaTunnel checkpoint bucket(幂等 mb -p)
  dcp-minio-init:
    image: minio/mc:latest
    container_name: dcp-minio-init
    depends_on:
      dcp-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://dcp-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123}
      && mc mb -p local/dcp-seatunnel-checkpoint
      && mc anonymous set none local/dcp-seatunnel-checkpoint
      && mc mb -p local/dcp-logic-repo
      && mc version enable local/dcp-logic-repo
      && mc anonymous set none local/dcp-logic-repo"

  # SeaTunnel Zeta 执行引擎（设计文档 §3.4; checkpoint 已切 MinIO S3 共享存储, 判死迁移/HA 前提）
  seatunnel:
    build: ./seatunnel
    container_name: dcp-seatunnel
    restart: unless-stopped
    mem_limit: 1536m   # 引擎+客户端双 JVM 预算(实测: 768m 触发 cgroup OOM 杀客户端 exit 137)
    depends_on:
      demo-db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      dcp-minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - seatunnel-checkpoint:/opt/checkpoint   # 遗留本地卷(checkpoint 已切 S3, 保留作降级兜底)
    ports:
      - "8082:8081"
      - "5801:5801"
      - "5802:5802"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/running-jobs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  backend:
    build: ./backend
    container_name: dcp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      demo-db:
        condition: service_healthy
      seatunnel:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # 本地实测无需 Nacos 注册(发现注册关闭; 生产三机环境用 nacos 服务发现)
      SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: ${SPRING_CLOUD_NACOS_DISCOVERY_ENABLED:-false}
      # 调度实例注册/对账(与 dcp-worker 同款, 缺省指向 compose 内 etcd)
      DCP_ETCD: ${DCP_ETCD:-http://dcp-etcd:2379}
      # cdc-st 作业 sink Kafka(生产缺省三机 outlet; 本地 compose 覆盖为栈内 kafka)
      SYNC_CDCST_KAFKA_BOOTSTRAP: ${SYNC_CDCST_KAFKA_BOOTSTRAP:-kafka:9092}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-dcp-kafka:9092}
      SYNC_TARGET_URL: ${SYNC_TARGET_URL:-jdbc:mysql://mysql:3306/demo2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      SYNC_TARGET_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      SYNC_CDCST_ALERT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      LAKESYNC_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      # dcp-worker 执行体服务(P0d: TaskSpec 提交/注销/扩容建议消费均走 REST,不再直连 etcd)
      DCP_WORKER_URL: ${DCP_WORKER_URL:-http://dcp-worker:8097}
      # 入站底座任务登记桥(P3):控制面地址; 入站消费已迁出至底座(kafka-ingest@1.0.0), 只登记不激活
      OUTLET_CONTROL_URL: ${OUTLET_CONTROL_URL:-http://outlet-service:8095}
      INGEST_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      INGEST_META_USER: root
      INGEST_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      INGEST_KAFKA_BOOTSTRAP: ${INGEST_KAFKA_BOOTSTRAP:-dcp-kafka:9092}
      # 打标引擎/在线标签/流作业已迁出至 tagengine-service(N9); 湖同步(LakeSync)保留
      DCP_LAKESYNC_CATALOG_URI: ${DCP_LAKESYNC_CATALOG_URI:-http://dcp-polaris:8181/api/catalog}
      DCP_LAKESYNC_CATALOG_TOKEN_URL: ${DCP_LAKESYNC_CATALOG_TOKEN_URL:-http://dcp-polaris:8181/api/catalog/v1/oauth/tokens}
      DCP_LAKESYNC_CATALOG_S3_ENDPOINT: ${DCP_LAKESYNC_CATALOG_S3_ENDPOINT:-http://dcp-minio:9000}
      DCP_LAKESYNC_CATALOG_S3_ACCESS_KEY: ${DCP_LAKESYNC_CATALOG_S3_ACCESS_KEY:-minioadmin}
      DCP_LAKESYNC_CATALOG_S3_SECRET_KEY: ${DCP_LAKESYNC_CATALOG_S3_SECRET_KEY:-minioadmin123}
      PLATFORM_ENC_KEY: ${PLATFORM_ENC_KEY:?PLATFORM_ENC_KEY 未设置: 请在 .env 或环境变量中配置随机密钥}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置: 请在 .env 或环境变量中配置随机密钥}
      SYNC_TOPICS: ${SYNC_TOPICS:-dcp.biz_orders,dcp.rt_orders_b,dcp.rt_sync_c,dcp.t_oms_sync}
      TZ: Asia/Shanghai
    ports:
      - "8081:8080"
    volumes:
      - ./demo-agent-dir:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - default
      - dcp-lake

  frontend:
    build: ./frontend
    container_name: dcp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # 统一调度框架 etcd(三 ns 调度主的状态底座; 验证拓扑统一入口)
  dcp-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: dcp-etcd
    restart: unless-stopped
    environment:
      ETCD_NAME: dcp-etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://dcp-etcd:2379
      ETCD_DATA_DIR: /etcd-data
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    volumes:
      - etcd-data:/etcd-data
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # outlet 控制面(业务外壳 + 消费底座规划; TaskSpec 提交走 dcp-worker REST, 不直连 etcd)
  outlet-service:
    build: ./outlet-service
    container_name: dcp-outlet-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      outlet-kafka:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DCP_WORKER_URL: ${DCP_WORKER_URL:-http://dcp-worker:8097}
      OUTLET_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      OUTLET_META_USERNAME: root
      OUTLET_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      OUTLET_KAFKA_BOOTSTRAP: outlet-kafka:19092
      OUTLET_LOGIC_S3_ENDPOINT: http://dcp-minio:9000
      OUTLET_LOGIC_S3_BUCKET: dcp-logic-repo
      OUTLET_LOGIC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OUTLET_LOGIC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OUTLET_LOGIC_CACHE_DIR: /tmp/outlet-logic-cache
      TZ: Asia/Shanghai
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8095/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 出口交付域服务(N10: 变更流出口数据面 /api/chg + 契约视图 /api/outlet/contracts)
  delivery-service:
    build: ./delivery-service
    container_name: dcp-delivery-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      outlet-kafka:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DELIVERY_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DELIVERY_META_USERNAME: root
      DELIVERY_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      DELIVERY_KAFKA_BOOTSTRAP: outlet-kafka:19092
      # 变更流源: L1 内部流 topic(与 backend 旧 dcp.outlet.kafka.topics 同源)
      OUTLET_KAFKA_TOPICS: ${OUTLET_KAFKA_TOPICS:-dcp.cdc.target_db}
      OUTLET_KAFKA_GROUP: ${OUTLET_KAFKA_GROUP:-dcp-outlet}
      OUTLET_SOURCE: ${OUTLET_SOURCE:-kafka}
      OUTLET_REGISTRY: ${OUTLET_REGISTRY:-mapper}
      # TiDB/ticdc 在 outlet compose(docker-compose.outlet.yml) 提供; 快照/监控不可达时降级
      OUTLET_TIDB_URL: ${OUTLET_TIDB_URL:-jdbc:mysql://dcp-outlet-tidb1:4000/target_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      OUTLET_MONITOR_TICDC_URL: ${OUTLET_MONITOR_TICDC_URL:-http://ticdc1:8300}
      OUTLET_MONITOR_KAFKA_BOOTSTRAP: ${OUTLET_MONITOR_KAFKA_BOOTSTRAP:-outlet-kafka:19092}
      TZ: Asia/Shanghai
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 数据订阅域服务(N11: /api/data-sub 管理面 + 订阅方 PULL 数据服务 API)
  subscription-service:
    build: ./subscription-service
    container_name: dcp-subscription-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SUBSCRIPTION_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SUBSCRIPTION_META_USERNAME: root
      SUBSCRIPTION_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      # 管理面 JWT 验证(与 backend 同 secret)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置: 请在 .env 或环境变量中配置随机密钥}
      # push 交付 Kafka(raw producer)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-dcp-kafka:9092}
      # 订阅推送底座任务登记桥(P3): 实时/流式档 → sub-push 底座任务(只登记不激活)
      DCP_OUTLET_CONTROL_URL: ${DCP_OUTLET_CONTROL_URL:-http://outlet-service:8095}
      DCP_SUB_PUSH_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DCP_SUB_PUSH_META_USER: root
      DCP_SUB_PUSH_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      DCP_SUB_PUSH_KAFKA_BOOTSTRAP: ${DCP_SUB_PUSH_KAFKA_BOOTSTRAP:-dcp-kafka:9092}
      # 目标库(视图解析/快照/changes 查询, 与 backend dcp.sync.target 同源)
      SYNC_TARGET_URL: ${SYNC_TARGET_URL:-jdbc:mysql://mysql:3306/demo2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      SYNC_TARGET_USERNAME: ${SYNC_TARGET_USERNAME:-root}
      SYNC_TARGET_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      TZ: Asia/Shanghai
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 资产目录+血缘域服务(N12: /api/asset-catalog + /api/lineage)
  asset-service:
    build: ./asset-service
    container_name: dcp-asset-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      ASSET_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      ASSET_META_USERNAME: root
      ASSET_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      # 管理面 JWT 验证(与 backend 同 secret)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置: 请在 .env 或环境变量中配置随机密钥}
      # 目标库(血缘重建 schema/存量解析, 与 backend dcp.sync.target 同源)
      SYNC_TARGET_URL: ${SYNC_TARGET_URL:-jdbc:mysql://mysql:3306/demo2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      SYNC_TARGET_USERNAME: ${SYNC_TARGET_USERNAME:-root}
      SYNC_TARGET_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      LINEAGE_NEO4J_URI: ${LINEAGE_NEO4J_URI:-bolt://neo4j:7687}
      LINEAGE_NEO4J_USER: ${LINEAGE_NEO4J_USER:-neo4j}
      LINEAGE_NEO4J_PASSWORD: ${LINEAGE_NEO4J_PASSWORD:-neo4j123}
      TZ: Asia/Shanghai
    ports:
      - "8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 打标引擎域服务(N9: /api/tagengine 规则/任务/数据集/标签/在线 + /api/data-policy + 流作业管理)
  tagengine-service:
    build: ./tagengine-service
    container_name: dcp-tagengine-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      dcp-redis:
        condition: service_started
      kafka:
        condition: service_started
      outlet-service:
        condition: service_started
      flink-jobmanager:
        condition: service_started
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TAGENGINE_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      TAGENGINE_META_USERNAME: root
      TAGENGINE_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      # 在线标签层(Redis tag:online:{entity})
      TAGENGINE_REDIS_HOST: ${TAGENGINE_REDIS_HOST:-dcp-redis}
      TAGENGINE_REDIS_PORT: ${TAGENGINE_REDIS_PORT:-6379}
      # 在线事件源(dcp.in.* 订阅)
      TAGENGINE_KAFKA_BOOTSTRAP: ${TAGENGINE_KAFKA_BOOTSTRAP:-dcp-kafka:9092}
      # 管理面 JWT 验证(与 backend 同 secret)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置: 请在 .env 或环境变量中配置随机密钥}
      # 目标库(数据集字段探测/批快照只读入口, 与 backend dcp.sync.target 同源)
      SYNC_TARGET_URL: ${SYNC_TARGET_URL:-jdbc:mysql://dcp-outlet-tidb1:4000/target_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      SYNC_TARGET_USERNAME: ${SYNC_TARGET_USERNAME:-root}
      SYNC_TARGET_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      # 批执行器(spark-submit/simulate)
      DCP_TAGENGINE_RUNNER_MODE: ${DCP_TAGENGINE_RUNNER_MODE:-simulate}
      DCP_TAGENGINE_EXECUTOR_JAR: ${DCP_TAGENGINE_EXECUTOR_JAR:-}
      DCP_TAGENGINE_SPARK_SUBMIT: ${DCP_TAGENGINE_SPARK_SUBMIT:-spark-submit}
      DCP_TAGENGINE_RUNS_DIR: ${DCP_TAGENGINE_RUNS_DIR:-/tmp/dcp-tagengine}
      DCP_TAGENGINE_AUTO_RUN: ${DCP_TAGENGINE_AUTO_RUN:-false}
      # 增量双轨切流开关(N8): external=Flink | unit=底座 TagLogic(dcp-tag-task, 需部署 logic-repo/tag-engine/1.0.0.jar)
      DCP_TAGENGINE_INCREMENTAL_ENGINE: ${DCP_TAGENGINE_INCREMENTAL_ENGINE:-external}
      # 流作业平台化(Flink REST 提交)
      DCP_TAGSTREAM_FLINK_URL: ${DCP_TAGSTREAM_FLINK_URL:-http://flink-jobmanager:8081}
      DCP_TAGSTREAM_JAR: ${DCP_TAGSTREAM_JAR:-/opt/dcp-tagstream.jar}
      DCP_TAGSTREAM_KAFKA: ${DCP_TAGSTREAM_KAFKA:-dcp.in.}
      DCP_TAGSTREAM_JDBC_URL: ${DCP_TAGSTREAM_JDBC_URL:-jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      DCP_TAGSTREAM_JDBC_USER: ${DCP_TAGSTREAM_JDBC_USER:-root}
      DCP_TAGSTREAM_JDBC_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      DCP_TAGSTREAM_REDIS_HOST: ${DCP_TAGSTREAM_REDIS_HOST:-dcp-redis}
      DCP_TAGSTREAM_REDIS_PORT: ${DCP_TAGSTREAM_REDIS_PORT:-6379}
      # 打标事件流发射(tag 契约订阅推送底座任务 dcp-sub-push 数据源; 底座运行时=dcp-worker outlet ns → outlet-kafka)
      DCP_TAGSTREAM_TAG_EVENTS_ENABLED: ${DCP_TAGSTREAM_TAG_EVENTS_ENABLED:-false}
      DCP_TAGSTREAM_TAG_EVENTS_KAFKA_BOOTSTRAP: ${DCP_TAGSTREAM_TAG_EVENTS_KAFKA_BOOTSTRAP:-outlet-kafka:19092}
      DCP_TAGSTREAM_TAG_EVENTS_TOPIC: ${DCP_TAGSTREAM_TAG_EVENTS_TOPIC:-dcp.tag.events}
      # v2 任务登记/作业控制走 outlet-service REST
      DCP_OUTLET_CONTROL_URL: ${DCP_OUTLET_CONTROL_URL:-http://outlet-service:8095}
      TZ: Asia/Shanghai
    ports:
      - "8100:8100"
    volumes:
      - ./dcp-tagstream/target/dcp-tagstream.jar:/opt/dcp-tagstream.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # dcp-worker 执行体(一镜像一骨架多 ns: sync/indexer/outlet/filesync 池化实例; 业务 jar bind mount 本地联调)
  dcp-worker:
    build: ./dcp-worker
    container_name: dcp-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      dcp-etcd:
        condition: service_healthy
      kafka:
        condition: service_started
      outlet-kafka:
        condition: service_started
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DCP_ETCD: ${DCP_ETCD:-http://dcp-etcd:2379}
      DCP_WORKER_INSTANCE_ID: ${DCP_WORKER_INSTANCE_ID:-dcp-worker-1}
      # tag/lake/sub/ingest = 消费底座多 ns 拆分(底座任务按部署器归 ns; ingest 消费平台栈, 其余出口栈)
      DCP_WORKER_NAMESPACES: ${DCP_WORKER_NAMESPACES:-sync:64:true,indexer:32:true,outlet:16:true,filesync:16:true,tag:32:true,lake:32:true,sub:32:true,ingest:64:true}
      # 业务 jar(本地联调形态 ns@/path; jar_release 流程见方案 M7)
      DCP_WORKER_BUNDLES: ${DCP_WORKER_BUNDLES:-sync@/opt/dcp/bundles/dcp-synclink.jar,indexer@/opt/dcp/bundles/dcp-indexer-rt.jar,outlet@/opt/dcp/bundles/dcp-outlet-rt.jar,filesync@/opt/dcp/bundles/dcp-filesync-rt.jar}
      DCP_WORKER_META_JDBC_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DCP_WORKER_META_USERNAME: root
      DCP_WORKER_META_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      DCP_WORKER_KAFKA_SYNC: kafka:9092
      DCP_WORKER_KAFKA_INDEXER: outlet-kafka:19092
      DCP_WORKER_KAFKA_OUTLET: outlet-kafka:19092
      DCP_WORKER_KAFKA_TAG: outlet-kafka:19092
      DCP_WORKER_KAFKA_LAKE: outlet-kafka:19092
      DCP_WORKER_KAFKA_SUB: outlet-kafka:19092
      DCP_WORKER_KAFKA_INGEST: kafka:9092
      DCP_WORKER_SYNC_TARGET_URL: jdbc:mysql://mysql:3306/demo2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DCP_WORKER_SYNC_TARGET_USERNAME: root
      DCP_WORKER_SYNC_TARGET_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      DCP_WORKER_OUTLET_LOGIC_REPO: /app/logic-repo
      DCP_WORKER_OUTLET_CONTROL_URL: http://outlet-service:8095
      # 文件同步执行器(与 backend PLATFORM_ENC_KEY / 目标 MinIO 同源)
      DCP_FILESYNC_ENC_KEY: ${PLATFORM_ENC_KEY:?PLATFORM_ENC_KEY 未设置: 请在 .env 或环境变量中配置随机密钥}
      DCP_FILESYNC_TARGET_ENDPOINT: http://dcp-minio:9000
      DCP_FILESYNC_TARGET_ACCESS_KEY: minioadmin
      DCP_FILESYNC_TARGET_SECRET_KEY: minioadmin123
      TZ: Asia/Shanghai
    ports:
      - "8097:8097"
    volumes:
      - ./dcp-synclink/target/dcp-synclink.jar:/opt/dcp/bundles/dcp-synclink.jar:ro
      - ./dcp-indexer-rt/target/dcp-indexer-rt.jar:/opt/dcp/bundles/dcp-indexer-rt.jar:ro
      - ./dcp-outlet-rt/target/dcp-outlet-rt.jar:/opt/dcp/bundles/dcp-outlet-rt.jar:ro
      - ./dcp-filesync-rt/target/dcp-filesync-rt.jar:/opt/dcp/bundles/dcp-filesync-rt.jar:ro
      - ./dcp-outlet-rt/logic-repo:/app/logic-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8097/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 采集 Agent(模拟业务机): rclone sync/copy 直推目标 MinIO; 注册码启动时经 DCP_AGENT_REGISTER_CODE 注入(一次性)
  agent:
    build: ./agent
    container_name: dcp-agent
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DCP_AGENT_PLATFORM_URL: http://dcp-backend:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DCP_AGENT_REGISTER_CODE: ${DCP_AGENT_REGISTER_CODE:-}
      DCP_AGENT_DATA_DIR: /var/lib/dcp-agent
      DCP_AGENT_HEARTBEAT_SEC: "20"
    volumes:
      - agent-data:/var/lib/dcp-agent
      - ./demo-agent-dir:/data          # 业务机文件目录(任务源, 挂载根 /data)

  tidb:
    image: pingcap/tidb:v7.5.0
    container_name: dcp-tidb
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "10080:10080"
    # 打标在线执行 Redis(P1): 在线层 tag:online:{entity} hash + TTL
  dcp-redis:
    image: redis:latest
    container_name: dcp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 打标流执行 Flink(P1): 事件流 → Drools → 双写(Redis 在线 + 投影事实层)
  flink-jobmanager:
    image: flink:1.18.1-java17
    container_name: dcp-flink-jm
    restart: unless-stopped
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - TZ=Asia/Shanghai
    ports:
      - "8084:8081"
  flink-taskmanager:
    image: flink:1.18.1-java17
    container_name: dcp-flink-tm
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      - TZ=Asia/Shanghai

  # 血缘图存储 Neo4j(2026-09-09): 逻辑表核心/多源合流/下游多应用; 前端知识图谱与影响/溯源查询
  neo4j:
    image: neo4j:5-community
    container_name: dcp-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  # 数据面 TiDB(2026-09-14 起指向新集群 dcp-outlet-tidb1:4000;旧单节点已退役,见 docker-compose.outlet.yml)
  # 水平扩容实测: 第二个消费者实例(同镜像/同 group, Kafka rebalance 自动分摊分区)
  backend2:
    build: ./backend
    container_name: dcp-backend2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      demo-db:
        condition: service_healthy
      seatunnel:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      NACOS_ADDR: nacos:8848
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置: 请在 .env 中配置}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-dcp-outlet-kafka1:9092,dcp-outlet-kafka2:9092,dcp-outlet-kafka3:9092}
      SYNC_TARGET_URL: ${SYNC_TARGET_URL:-jdbc:mysql://dcp-outlet-tidb1:4000/target_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      PLATFORM_ENC_KEY: ${PLATFORM_ENC_KEY:?PLATFORM_ENC_KEY 未设置: 请在 .env 或环境变量中配置随机密钥}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置: 请在 .env 或环境变量中配置随机密钥}
      SYNC_TOPICS: ${SYNC_TOPICS:-dcp.biz_orders,dcp.rt_orders_b,dcp.rt_sync_c,dcp.t_oms_sync}
      TZ: Asia/Shanghai
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  prometheus-data:
  etcd-data:
  agent-data:
  seatunnel-checkpoint:
  minio-data:
  sqlserver-data:
  oracle-data:
  neo4j-data:
  mysql-data:
  demo-db-data:
  mongo-data:
  postgres-data:

networks:
  default:
  dcp-lake:
    external: true
