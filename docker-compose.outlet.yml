# ============================================================================
# 变更流出口 · 生产级数据面栈(2026-09-14)
#   TiDB 集群(PD×3 + TiKV×3 + TiDB×2)+ TiCDC 集群(×2)+ Kafka 3 broker(KRaft)
#
# 设计依据:《数据采集平台V3-变更流出口设计-2026-09-14》§5.1 生产基线 / §5.2 changefeed
# 决策依据:决策 10(按设计新建集群并重新部署)、决策 12(窗口三件套 ≥7 天)、
#           决策 13(现有单节点 TiDB 不保留、旧数据不迁移)
#
# 用法:
#   docker compose -f docker-compose.outlet.yml up -d
#   docker compose -f docker-compose.outlet.yml ps
#   docker compose -f docker-compose.outlet.yml down          # 停(保留卷)
#   docker compose -f docker-compose.outlet.yml down -v       # 停并清数据
#
# 说明:
#   · 复用现有外部网络 data-collect-platform_default → 平台 backend/agent 可直接访问
#     新集群服务名(tidb1/tidb2),免改网络。
#   · 宿主端口与现有环境全部错开(现有 dcp-tidb=4000、dcp-kafka=9092):
#     PD 12379 / TiDB 14000·14010 / TiCDC 18300·18301 / Kafka 19092·19093·19094
#   · 内存:每实例设上限(见各服务 mem_limit),符合本机 16G 现实。
# ============================================================================
name: dcp-outlet

x-outlet-net: &outlet-net
  networks:
    - outlet

services:
  # ---------------------------------------------------------------- PD ×3
  pd1:
    image: pingcap/pd:v7.5.0
    container_name: dcp-outlet-pd1
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --name=pd1
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd1:2379
      - --advertise-peer-urls=http://pd1:2380
      - --initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380
    ports:
      - "12379:2379"          # 宿主验证用:curl http://localhost:12379/pd/api/v1/stores
    volumes:
      - pd1-data:/data
    mem_limit: 320m

  pd2:
    image: pingcap/pd:v7.5.0
    container_name: dcp-outlet-pd2
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --name=pd2
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd2:2379
      - --advertise-peer-urls=http://pd2:2380
      - --initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380
    volumes:
      - pd2-data:/data
    mem_limit: 320m

  pd3:
    image: pingcap/pd:v7.5.0
    container_name: dcp-outlet-pd3
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --name=pd3
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd3:2379
      - --advertise-peer-urls=http://pd3:2380
      - --initial-cluster=pd1=http://pd1:2380,pd2=http://pd2:2380,pd3=http://pd3:2380
    volumes:
      - pd3-data:/data
    mem_limit: 320m

  # --------------------------------------------------------------- TiKV ×3
  tikv1:
    image: pingcap/tikv:v7.5.0
    container_name: dcp-outlet-tikv1
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --status-addr=0.0.0.0:20180
      - --pd=pd1:2379,pd2:2379,pd3:2379
      - --data-dir=/data
    volumes:
      - tikv1-data:/data
    mem_limit: 900m
    depends_on: [pd1, pd2, pd3]

  tikv2:
    image: pingcap/tikv:v7.5.0
    container_name: dcp-outlet-tikv2
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --status-addr=0.0.0.0:20180
      - --pd=pd1:2379,pd2:2379,pd3:2379
      - --data-dir=/data
    volumes:
      - tikv2-data:/data
    mem_limit: 900m
    depends_on: [pd1, pd2, pd3]

  tikv3:
    image: pingcap/tikv:v7.5.0
    container_name: dcp-outlet-tikv3
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv3:20160
      - --status-addr=0.0.0.0:20180
      - --pd=pd1:2379,pd2:2379,pd3:2379
      - --data-dir=/data
    volumes:
      - tikv3-data:/data
    mem_limit: 900m
    depends_on: [pd1, pd2, pd3]

  # --------------------------------------------------------------- TiDB ×2
  tidb1:
    image: pingcap/tidb:v7.5.0
    container_name: dcp-outlet-tidb1
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --store=tikv
      - --path=pd1:2379,pd2:2379,pd3:2379
      - --advertise-address=tidb1
      - --host=0.0.0.0
      - -P=4000
      - --status=0.0.0.0:10080
    ports:
      - "14000:4000"
      - "14080:10080"
    mem_limit: 700m
    depends_on: [pd1, pd2, pd3, tikv1, tikv2, tikv3]

  tidb2:
    image: pingcap/tidb:v7.5.0
    container_name: dcp-outlet-tidb2
    <<: *outlet-net
    restart: unless-stopped
    command:
      - --store=tikv
      - --path=pd1:2379,pd2:2379,pd3:2379
      - --advertise-address=tidb2
      - --host=0.0.0.0
      - -P=4000
      - --status=0.0.0.0:10080
    ports:
      - "14010:4000"
    mem_limit: 700m
    depends_on: [pd1, pd2, pd3, tikv1, tikv2, tikv3]

  # -------------------------------------------------------------- TiCDC ×2
  ticdc1:
    image: pingcap/ticdc:v7.5.0
    container_name: dcp-outlet-ticdc1
    <<: *outlet-net
    restart: unless-stopped
    command:
      - /cdc
      - server
      - --addr=0.0.0.0:8300
      - --advertise-addr=ticdc1:8300
      - --pd=http://pd1:2379,http://pd2:2379,http://pd3:2379
    ports:
      - "18300:8300"
    mem_limit: 500m
    depends_on: [pd1, pd2, pd3, tikv1, tikv2, tikv3]

  ticdc2:
    image: pingcap/ticdc:v7.5.0
    container_name: dcp-outlet-ticdc2
    <<: *outlet-net
    restart: unless-stopped
    command:
      - /cdc
      - server
      - --addr=0.0.0.0:8300
      - --advertise-addr=ticdc2:8300
      - --pd=http://pd1:2379,http://pd2:2379,http://pd3:2379
    ports:
      - "18301:8300"
    mem_limit: 500m
    depends_on: [pd1, pd2, pd3, tikv1, tikv2, tikv3]

  # ------------------------------------------------------- Kafka ×3 (KRaft)
  kafka1:
    image: apache/kafka:3.7.0
    container_name: dcp-outlet-kafka1
    <<: *outlet-net
    restart: unless-stopped
    environment:
      CLUSTER_ID: dcpOutletKafkaCluster01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168          # 决策 12:retention ≥7 天
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19092:19092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    mem_limit: 700m

  kafka2:
    image: apache/kafka:3.7.0
    container_name: dcp-outlet-kafka2
    <<: *outlet-net
    restart: unless-stopped
    environment:
      CLUSTER_ID: dcpOutletKafkaCluster01
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,HOST://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19093:19093"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    mem_limit: 700m

  kafka3:
    image: apache/kafka:3.7.0
    container_name: dcp-outlet-kafka3
    <<: *outlet-net
    restart: unless-stopped
    environment:
      CLUSTER_ID: dcpOutletKafkaCluster01
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,HOST://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19094:19094"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    mem_limit: 700m

volumes:
  pd1-data:
  pd2-data:
  pd3-data:
  tikv1-data:
  tikv2-data:
  tikv3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  outlet:
    name: data-collect-platform_default
    external: true
