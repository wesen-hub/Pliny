server:
  port: 8088

spring:
  application:
    name: dcp-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
    sentinel:
      eager: true   # M4: 网关限流靠本地 GlobalFilter 手动 SphU.entry, 规则注册后即时生效
  config:
    import:
      # M1: 配置中心外迁(optional: Nacos 不可达时回退本地 yml, 本地开发/降级不阻断启动)
      - optional:nacos:dcp-common.yml
      - optional:nacos:${spring.application.name}.yml
    gateway:
      # 路由表与 frontend/nginx.conf 的 location 一一对应(唯一入口收敛到本网关)
      routes:
        # 出口交付域(N10)两条: 变更流数据面 + 契约
        - id: delivery-chg
          uri: lb://delivery-service
          predicates:
            - Path=/api/chg/**
        - id: delivery-contracts
          uri: lb://delivery-service
          predicates:
            - Path=/api/outlet/contracts/**
        # 出口控制域: outlet-service(注册名 dcp-outlet-control)
        - id: outlet-control
          uri: lb://dcp-outlet-control
          predicates:
            - Path=/api/outlet/**
        # 订阅域(N11)
        - id: subscription
          uri: lb://subscription-service
          predicates:
            - Path=/api/data-sub/**
        # 资产+血缘域(N12): 目录 + 血缘 + 资产详情 + 标签体系(拆分后补齐归 asset-service)
        - id: asset-catalog
          uri: lb://asset-service
          predicates:
            - Path=/api/asset-catalog/**
        - id: asset-lineage
          uri: lb://asset-service
          predicates:
            - Path=/api/lineage/**
        - id: assets
          uri: lb://asset-service
          predicates:
            - Path=/api/assets/**
        - id: tags
          uri: lb://asset-service
          predicates:
            - Path=/api/tags/**
        # 订阅中心(订阅=标签条件命中资产; 拆分后补齐归 subscription-service)
        - id: subscriptions
          uri: lb://subscription-service
          predicates:
            - Path=/api/subscriptions/**
        # 打标引擎域(N9)两条: 打标 + 数据权限
        - id: tagengine
          uri: lb://tagengine-service
          predicates:
            - Path=/api/tagengine/**
        - id: data-policy
          uri: lb://tagengine-service
          predicates:
            - Path=/api/data-policy/**
        # 统一调度框架管理 API(dcp-worker 承载; 拆分后补齐, 此前兜底 backend 404/9000)
        - id: scheduler-admin
          uri: lb://dcp-worker
          predicates:
            - Path=/api/scheduler/**
        # 主控制面(兜底)
        - id: backend
          uri: lb://backend
          predicates:
            - Path=/api/**

dcp:
  # 管理面 JWT 验签 secret(与 backend 同源 env; 只验不签, 缺失/长度不足 32 字节启动失败)
  jwt-secret: ${JWT_SECRET}
  gateway:
    auth:
      # M2: 白名单路径(格式 METHOD:path, ANY=不限方法; 与各后端服务 SecurityConfig permitAll 对齐)。
      # 放行原因: 机器通道/订阅方 PULL 由后端自校验(appKey/X-Agent-Secret/X-Dcp-Token/契约),
      # 不经网关时后端自验兜底; OPTIONS 预检一律放行。
      whitelist:
        - ANY:/api/auth/login
        - ANY:/api/actuator/**
        - POST:/api/ingest/*
        - GET:/api/ingest/meta/*
        - ANY:/api/agents/**
        - ANY:/api/chg/**
        - ANY:/api/outlet/contracts/**
        - GET:/api/data-sub/*/schema
        - GET:/api/data-sub/*/snapshot
        - GET:/api/data-sub/*/changes
        - POST:/api/data-sub/*/export
        - GET:/api/data-sub/export-task/**
    sentinel:
      # M4: 网关限流规则(全内嵌, 格式 "路径前缀:QPS"; 请求按最长前缀匹配取资源名,
      # 命中资源则按 QPS 限流, 超限返回 429)。default 为全量兜底。
      rules:
        - "/api/auth/login:20"     # 登录防爆破
        - "/api/sync/cdc-st:20"    # CDC 启停控制(与 backend 控制面限流双保险)
        - "/api/outlet:100"        # 出口控制域
        - "default:500"            # 全局兜底
