server:
  port: 8095

spring:
  application:
    name: dcp-outlet-control
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
    sentinel:
      eager: false
  config:
    import:
      # M1: 配置中心外迁(optional: Nacos 不可达时回退本地 yml, 本地开发/降级不阻断启动)
      - optional:nacos:dcp-common.yml
      - optional:nacos:${spring.application.name}.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      # M5: 统一挂 /api/actuator(与网关白名单 ANY:/api/actuator/** 对齐, Prometheus 直连抓取不受 JWT 拦截)
      base-path: /api/actuator
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    propagation:
      consume: b3
      produce: b3_multi
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

dcp:
  # dcp-worker 执行体服务(方案 §9:TaskSpec 提交/注销/探针读均走 REST,不再直连 etcd)
  # 服务发现模式: 填服务名 http://dcp-worker → @LoadBalanced Nacos 轮询; 显式 IP → 直连降级
  worker:
    url: ${DCP_WORKER_URL:http://dcp-worker}

outlet:
  # 元数据库(彻底版元数据表:consumer_task(纯业务登记) / chg_anchor / chg_watermark_latest /
  # consumer_logic / consumer_dlq / chg_stream;consumer_unit* 已删除,调度状态全部由框架 etcd 承担;
  # 建表见 outlet/v2-meta-ddl.sql)
  # 密码从环境变量注入,不落盘:OUTLET_META_PASSWORD=xxx
  meta:
    jdbc-url: ${OUTLET_META_JDBC_URL:jdbc:mysql://127.0.0.1:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${OUTLET_META_USERNAME:root}
    password: ${OUTLET_META_PASSWORD:}
  # 出口栈 Kafka(**不是**平台那套 kafka:9092;出口栈是 19092)
  kafka:
    bootstrap: ${OUTLET_KAFKA_BOOTSTRAP:127.0.0.1:19092}
    topic-prefix: dcp.cdc.
  start-offset:
    max-scan-rows: 200000
  # 批阶段 T0 三适配器
  ticdc:                                     # R1:changefeed start_ts(TiCDC OpenAPI v2)
    base-url: ${OUTLET_TICDC_BASE_URL:http://127.0.0.1:18300}
    changefeed-id: ${OUTLET_TICDC_CHANGEFEED_ID:chg-target-db}
  tidb:                                      # R2:TiDB GC safe point(只读)
    jdbc-url: ${OUTLET_TIDB_JDBC_URL:jdbc:mysql://127.0.0.1:14000/mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${OUTLET_TIDB_USERNAME:root}
    password: ${OUTLET_TIDB_PASSWORD:root123}
  snapshot:                                  # 快照源(平台既有快照 API,AS OF T0);身份 = 任务契约的 consumer_id(批/增量一致,不再配置服务级身份)
    base-url: ${OUTLET_SNAPSHOT_BASE_URL:http://127.0.0.1:8081}
  logic:
    # M7: 制品仓库迁 MinIO 共享桶(发布 PutObject 原子 + 桶版本化; 消费端拉取本地 sha256 内容寻址缓存)
    s3:
      endpoint: ${OUTLET_LOGIC_S3_ENDPOINT:http://127.0.0.1:9000}
      bucket: ${OUTLET_LOGIC_S3_BUCKET:dcp-logic-repo}
      region: ${OUTLET_LOGIC_S3_REGION:us-east-1}
      access-key: ${OUTLET_LOGIC_S3_ACCESS_KEY:minioadmin}
      secret-key: ${OUTLET_LOGIC_S3_SECRET_KEY:minioadmin123}
    cache-dir: ${OUTLET_LOGIC_CACHE_DIR:./logic-cache}
  epoch: ${OUTLET_EPOCH:1}                    # 水位/锚点 epoch(与索引器一致)
  indexer:                                   # 锚点索引器常驻启动器(栅栏方案前置条件)
    enabled: ${OUTLET_INDEXER_ENABLED:true}  # 常驻消费全量变更流;false=不启动(起点查询退化 earliest,慢不错)
    group-id: ${OUTLET_INDEXER_GROUP_ID:dcp-outlet-indexer}  # 固定消费组:重启后从上次提交位点续读
    from-beginning: ${OUTLET_INDEXER_FROM_BEGINNING:false}   # 无已提交位点时:false=latest;true=earliest 全量重建锚点
  batch:
    executor: ${OUTLET_BATCH_EXECUTOR:local}  # local | container | spark | auto(按行数:≥100万→spark;否则 container)
  spark:                                     # 批阶段 Spark 执行体(tagengine-executor)
    submit-bin: ${OUTLET_SPARK_SUBMIT_BIN:spark-submit}
    executor-jar: ${OUTLET_SPARK_EXECUTOR_JAR:}     # 执行器 jar 绝对路径(容器/Spark 节点可见);空=不提交
    catalog: ${OUTLET_SPARK_CATALOG:demo}
    namespace: ${OUTLET_SPARK_NAMESPACE:dcp}
    warehouse: ${OUTLET_SPARK_WAREHOUSE:}            # 写湖目标(空 = 由 spark-submit 环境自备 catalog)
    catalog-type: ${OUTLET_SPARK_CATALOG_TYPE:}      # hadoop | rest …(空 = 执行器缺省 hadoop)
  flink:                                     # 方案 C:增量段交给 Flink(dcp-tagstream)
    base-url: ${OUTLET_FLINK_BASE_URL:}             # Flink REST;空=只落 job-json 不提交
    jar: ${OUTLET_FLINK_JAR:}                        # dcp-tagstream.jar 绝对路径
    kafka-bootstrap: ${OUTLET_FLINK_KAFKA_BOOTSTRAP:}  # 下发进 job-json 的 Kafka 地址(Flink 集群视角);空=同 outlet.kafka.bootstrap

logging:
  level:
    root: INFO
    com.dcp.outlet: INFO
