server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 全部后端 API 统一转微服务治理网关(阶段 A): 路由表见 dcp-gateway application.yml
    #   /api/chg/              → lb://delivery-service    (变更流数据面 N10)
    #   /api/outlet/contracts/ → lb://delivery-service    (契约视图 N10)
    #   /api/outlet/           → lb://dcp-outlet-control  (出口计算面管理)
    #   /api/data-sub/         → lb://subscription-service(N11)
    #   /api/asset-catalog/    → lb://asset-service       (N12)
    #   /api/lineage/          → lb://asset-service       (N12)
    #   /api/tagengine/        → lb://tagengine-service   (N9)
    #   /api/data-policy/      → lb://tagengine-service   (N9)
    #   /api/**                → lb://backend             (主控制面兜底)
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gateway_upstream http://dcp-gateway:8088;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
