server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 变更流出口数据面 + 契约视图 → delivery-service(N10)
    location /api/chg/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $delivery_upstream http://delivery-service:8096;
        proxy_pass $delivery_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
    # 契约视图(计算面拉取) → delivery-service(N10)
    location /api/outlet/contracts/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $delivery_upstream http://delivery-service:8096;
        proxy_pass $delivery_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
    # 出口计算面管理(logics/tasks/streams/anchor) → outlet-service(8095)
    location /api/outlet/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $outlet_upstream http://outlet-service:8095;
        proxy_pass $outlet_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # 数据订阅域 → subscription-service(N11)
    location /api/data-sub/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $subscription_upstream http://subscription-service:8098;
        proxy_pass $subscription_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # 资产目录 + 血缘 → asset-service(N12)
    location /api/asset-catalog/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $asset_upstream http://asset-service:8099;
        proxy_pass $asset_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
    location /api/lineage/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $asset_upstream http://asset-service:8099;
        proxy_pass $asset_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # 打标引擎域(规则/任务/数据集/标签/在线/流作业 + 数据权限) → tagengine-service(N9)
    location /api/tagengine/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tagengine_upstream http://tagengine-service:8100;
        proxy_pass $tagengine_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
    location /api/data-policy/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tagengine_upstream http://tagengine-service:8100;
        proxy_pass $tagengine_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # 其余后端 API 反向代理（动态 DNS: backend 容器重建 IP 会变, 用 Docker 内置 DNS + 变量避免缓存旧 IP）
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
