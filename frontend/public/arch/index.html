<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据采集平台 V3 · 系统架构设计图</title>
<style>
  :root{
    --bg:#eef2f8;
    --border:#e4ebf5;
    --text:#0f172a;
    --text-2:#475569;
    --text-3:#94a3b8;
    --accent:#3b82f6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1400px 700px at 12% -12%, #e7eefb 0%, transparent 62%),
      radial-gradient(1100px 600px at 96% 112%, #eaf1fd 0%, transparent 58%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{height:100vh;display:flex;flex-direction:column;}

  .topbar{
    flex:none;display:flex;align-items:center;gap:22px;
    height:64px;padding:0 22px;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(226,234,245,.9);
    box-shadow:0 1px 2px rgba(15,23,42,.03);
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .logo{
    width:36px;height:36px;flex:none;border-radius:10px;
    background:linear-gradient(135deg,#4f8cff,#8b5cf6);
    display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 5px 14px -3px rgba(79,140,255,.55);
  }
  .brand-text{min-width:0;}
  .brand-text h1{
    margin:0;font-size:14px;font-weight:650;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px;
  }
  .brand-text p{
    margin:2px 0 0;font-size:11.5px;color:var(--text-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px;
  }

  .breadcrumb{
    margin-left:auto;display:flex;align-items:center;
    overflow-x:auto;scrollbar-width:none;
  }
  .breadcrumb::-webkit-scrollbar{display:none;}
  .crumb{
    border:none;background:transparent;cursor:pointer;font-family:inherit;
    font-size:12.5px;color:#64748b;padding:6px 11px;border-radius:8px;
    white-space:nowrap;transition:background .15s,color .15s;
  }
  .crumb:hover{background:#eff4fb;color:var(--text);}
  .crumb.active{color:#1d4ed8;font-weight:650;background:#eaf1fe;cursor:default;}
  .crumb-sep{color:#cbd5e1;font-size:11px;padding:0 1px;user-select:none;}

  .stage{
    flex:1;min-height:0;overflow:auto;
    padding:22px;
    display:flex;align-items:center;justify-content:center;
    scrollbar-width:thin;
  }
  .stage::-webkit-scrollbar{width:9px;height:9px;}
  .stage::-webkit-scrollbar-thumb{
    background:#cfdae8;border-radius:9px;border:2px solid transparent;
    background-clip:padding-box;
  }
  .stage::-webkit-scrollbar-thumb:hover{background:#b9c8da;background-clip:padding-box;}

  .canvas-fit{position:relative;flex:0 0 auto;margin:auto;}
  .canvas{
    position:absolute;left:0;top:0;
    transform-origin:top left;
    background:#fff;
    background-image:radial-gradient(circle, #e8eef7 1px, transparent 1px);
    background-size:22px 22px;
    background-position:-1px -1px;
    border-radius:20px;
    border:1px solid #e9eff7;
    box-shadow:
      0 1px 3px rgba(15,23,42,.04),
      0 22px 60px -26px rgba(15,23,42,.18);
  }
  .groups,.labels,.nodes{position:absolute;inset:0;}
  .groups{z-index:0;}
  .links{position:absolute;left:0;top:0;z-index:1;overflow:visible;pointer-events:none;}
  .labels{z-index:5;pointer-events:none;}
  .nodes{z-index:4;pointer-events:none;}
  .nodes .node{pointer-events:auto;}

  .group{
    position:absolute;
    border:1.5px solid #e9f0f9;
    border-radius:18px;
    background:linear-gradient(180deg, rgba(250,252,255,.94), rgba(247,250,254,.6));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  }
  .group-label{
    position:absolute;top:-11px;left:20px;
    padding:2px 12px;
    font-size:11px;font-weight:700;letter-spacing:.08em;
    color:#93a5bb;
    background:#fff;
    border:1px solid #e9f0f9;
    border-radius:99px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
    white-space:nowrap;
  }

  .node{
    position:absolute;
    display:flex;flex-direction:column;justify-content:center;
    padding:10px 14px 10px 18px;
    background:linear-gradient(135deg,#ffffff 0%,#fbfdff 100%);
    border:1px solid #e8eef7;
    border-radius:12px;
    box-shadow:
      0 1px 2px rgba(15,23,42,.04),
      0 6px 16px -9px rgba(15,23,42,.12);
    user-select:none;
    cursor:default;
    transition:transform .18s cubic-bezier(.22,1,.36,1),
               box-shadow .18s ease,
               border-color .18s ease,
               opacity .2s ease;
    animation:nodeIn .34s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes nodeIn{
    from{opacity:0;transform:translateY(9px) scale(.975);}
    to{opacity:1;transform:none;}
  }

  .node::before{
    content:'';
    position:absolute;left:0;top:14px;bottom:14px;
    width:3.5px;border-radius:0 3px 3px 0;
    background:var(--c,#3b82f6);
    box-shadow:0 0 10px -1px var(--c,#3b82f6);
  }
  .node::after{
    content:'';
    position:absolute;right:-28px;bottom:-28px;
    width:84px;height:84px;border-radius:50%;
    background:var(--c,#3b82f6);
    opacity:.07;
    filter:blur(10px);
    pointer-events:none;
  }

  .node.drillable{cursor:pointer;}
  .node:hover{
    transform:translateY(-2px);
    border-color:var(--c,#3b82f6);
    box-shadow:
      0 2px 5px rgba(15,23,42,.05),
      0 18px 38px -16px rgba(15,23,42,.28);
  }
  .node.dim{opacity:.16;filter:saturate(.4);}

  .node-name{
    font-size:13px;font-weight:650;color:var(--text);
    line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .node.drillable .node-name{padding-right:20px;}
  .node-meta{
    margin-top:4px;
    font-size:11px;line-height:1.42;color:#9aabbd;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .node.compact .node-meta{display:none;}

  .node-drill{
    position:absolute;top:7px;right:7px;
    width:19px;height:19px;border-radius:6px;
    display:grid;place-items:center;
    font-size:10px;font-weight:800;line-height:1;
    color:var(--c,#3b82f6);
    background:#f5f9fe;
    border:1px solid #e7eef8;
    transition:background .15s,color .15s,border-color .15s,transform .15s;
  }
  .node.drillable:hover .node-drill{
    background:var(--c,#3b82f6);
    color:#fff;
    border-color:var(--c,#3b82f6);
    transform:scale(1.1);
  }

  .link{
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke .18s ease,opacity .18s ease,stroke-width .18s ease;
  }
  .link.async{stroke-dasharray:7 5;}
  .link.dim{opacity:.07;}

  .link-hit{
    fill:none;
    stroke:transparent;
    stroke-width:22;
    stroke-linecap:round;
    pointer-events:stroke;
    cursor:pointer;
  }

  .link-flow{
    fill:none;
    stroke-width:2.3;
    stroke-linecap:round;
    stroke-dasharray:2 14;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .edge.active .link-flow{
    opacity:.95;
    animation:flow 1.05s linear infinite;
  }
  @keyframes flow{
    from{stroke-dashoffset:0;}
    to{stroke-dashoffset:-16;}
  }

  .link-label{
    position:absolute;
    transform:translate(-50%,-50%);
    padding:3px 10px;
    border-radius:99px;
    font-size:10.5px;font-weight:600;letter-spacing:.01em;
    color:#7c8ba1;
    background:#fff;
    border:1px solid #e8eef7;
    box-shadow:0 1px 4px rgba(15,23,42,.08);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    pointer-events:auto;
    transition:color .16s,background .16s,border-color .16s,box-shadow .16s,transform .16s,opacity .18s;
  }
  .link-label:hover,
  .link-label.hl{
    color:#fff;
    background:var(--lc,#3b82f6);
    border-color:var(--lc,#3b82f6);
    box-shadow:0 6px 18px -5px var(--lc,#3b82f6);
    transform:translate(-50%,-50%) scale(1.08);
  }
  .link-label.dim{opacity:.10;pointer-events:none;}
  .link-label.drillable::after{
    content:'↗';
    margin-left:5px;
    font-size:8.5px;
    opacity:.9;
  }

  .legend{
    position:fixed;left:22px;bottom:18px;z-index:25;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:8px 15px;
    background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(226,234,245,.95);
    border-radius:12px;
    box-shadow:0 10px 30px -14px rgba(15,23,42,.3);
    font-size:11px;color:#64748b;
  }
  .legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .legend-item i{width:9px;height:9px;border-radius:3px;display:block;flex:none;}
  .legend-item i.dash{
    width:17px;height:0;border-radius:0;
    border-top:2px dashed #f0b429;
  }
  .legend-item i.cursor{
    width:14px;height:14px;border-radius:50%;
    background:#3b82f6;opacity:.25;
    border:1.5px solid #3b82f6;
  }

  .detail{
    position:fixed;right:22px;bottom:22px;width:300px;z-index:30;
    background:#fff;
    border:1px solid #e8eef7;border-radius:14px;
    padding:16px 18px 18px;
    box-shadow:0 24px 60px -20px rgba(15,23,42,.35);
    animation:slideUp .22s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .detail[hidden]{display:none;}
  .detail-close{
    position:absolute;top:10px;right:10px;
    width:23px;height:23px;border-radius:7px;border:none;
    background:#f5f8fc;color:#94a3b8;cursor:pointer;
    font-size:14px;line-height:1;font-family:inherit;
    transition:background .15s,color .15s;
  }
  .detail-close:hover{background:#eef3fa;color:#475569;}
  .detail-badge{
    display:inline-block;font-size:10.5px;font-weight:700;
    padding:3px 8px;border-radius:6px;margin-bottom:9px;
    letter-spacing:.03em;
  }
  .detail h3{margin:0 0 7px;font-size:14px;font-weight:650;}
  .detail p{margin:0;font-size:12px;line-height:1.65;color:var(--text-2);}
  .detail .path{
    margin-top:9px;padding:8px 10px;
    background:#f7fafd;border-radius:8px;
    font-size:11px;color:#64748b;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .detail .path b{color:#334155;font-weight:600;}
  .detail .hint{
    margin-top:11px;padding-top:10px;
    border-top:1px dashed #e8eef7;
    font-size:11px;color:var(--text-3);
  }

  @media (max-width:760px){
    .topbar{height:auto;flex-wrap:wrap;padding:11px 14px;gap:10px;}
    .breadcrumb{margin-left:0;width:100%;}
    .brand-text h1,.brand-text p{max-width:220px;}
    .stage{padding:12px;}
    .legend{left:12px;right:12px;bottom:12px;justify-content:center;}
    .detail{left:12px;right:12px;width:auto;bottom:76px;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">D</div>
      <div class="brand-text">
        <h1 id="viewTitle">加载中…</h1>
        <p id="viewSub"></p>
      </div>
    </div>
    <nav class="breadcrumb" id="breadcrumb"></nav>
  </header>

  <main class="stage" id="stage">
    <div class="canvas-fit" id="canvasFit">
      <div class="canvas" id="canvas">
        <div class="groups" id="groups"></div>
        <svg class="links" id="links" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="labels" id="labels"></div>
        <div class="nodes" id="nodes"></div>
      </div>
    </div>
  </main>
</div>

<div class="legend">
  <span class="legend-item"><i style="background:#06b6d4"></i>客户端</span>
  <span class="legend-item"><i style="background:#8b5cf6"></i>接入层</span>
  <span class="legend-item"><i style="background:#3b82f6"></i>业务服务</span>
  <span class="legend-item"><i style="background:#14b8a6"></i>领域模型</span>
  <span class="legend-item"><i style="background:#f59e0b"></i>中间件</span>
  <span class="legend-item"><i style="background:#10b981"></i>数据存储</span>
  <span class="legend-item"><i class="dash"></i>异步消息</span>
  <span class="legend-item"><i class="cursor"></i>连线可点击</span>
</div>

<aside class="detail" id="detail" hidden>
  <button class="detail-close" id="detailClose" aria-label="关闭">×</button>
  <div class="detail-badge" id="detailBadge"></div>
  <h3 id="detailName"></h3>
  <p id="detailDesc"></p>
  <div class="path" id="detailPath" hidden></div>
  <div class="hint" id="detailHint">点击带 ↗ 的元素可继续下钻</div>
</aside>

<script>
/* =========================================================
 * 0. 基础常量
 * =======================================================*/
const NS = 'http://www.w3.org/2000/svg';

const TYPE_META = {
  client:  { color:'#06b6d4', label:'客户端'   },
  gateway: { color:'#8b5cf6', label:'接入层'   },
  service: { color:'#3b82f6', label:'业务服务' },
  domain:  { color:'#14b8a6', label:'领域模型' },
  infra:   { color:'#f59e0b', label:'中间件'   },
  data:    { color:'#10b981', label:'数据存储' }
};

const ASYNC_COLOR = '#f0b429';
const HL_COLOR    = '#3b82f6';

const DEFS = (() => {
  let s = '<defs>';
  const mk = (id, fill) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5"
      markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse"
      orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="${fill}"/>
    </marker>`;
  Object.entries(TYPE_META).forEach(([k, v]) => { s += mk('arw-' + k, v.color); });
  s += mk('arw-async', ASYNC_COLOR);
  s += mk('arw-hl', HL_COLOR);
  s += '</defs>';
  return s;
})();

/* =========================================================
 * 1. 视图数据 —— 数据采集平台 V3
 * =======================================================*/
const VIEWS = {

  /* ---------------- 顶层:系统总览 ---------------- */
  root: {
    title: '数据采集平台 V3 · 系统架构总览',
    subtitle: '采集 → 平台服务 → v2 消费通道 → 数据底座 · 模块与连线均可点击下钻',
    groups: [
      { name:'用户与采集 USER & COLLECT',     x:24,  y:30,  w:300, h:330 },
      { name:'平台服务层 PLATFORM SERVICES', x:348, y:30,  w:560, h:330 },
      { name:'v2 增量消费通道 CONSUMPTION',  x:932, y:30,  w:330, h:420 },
      { name:'数据底座 DATA & INFRA',        x:24,  y:474, w:1238, h:140 }
    ],
    nodes: [
      { id:'web',      name:'前端控制台', type:'client',  meta:'Vue3 · Vite · Element Plus', desc:'数据源/同步任务/标签/订阅/权限的全量管理界面,直连平台后端 REST。', x:48, y:76,  w:252, h:74 },
      { id:'agent',    name:'采集 Agent', type:'service', meta:'节点常驻进程',           desc:'部署在业务机,拉取命令执行采集任务,心跳上报执行状态。', x:48, y:172, w:252, h:74 },
      { id:'seatunnel',name:'同步引擎',   type:'domain',  meta:'SeaTunnel 3.x · 容器化', desc:'批/流数据同步执行体,源端读取并落地数据湖/目标库。',   x:48, y:268, w:252, h:74 },

      { id:'backend', name:'平台主后端', type:'service', meta:'Spring Boot 3.2 · 8081', desc:'数据接入、同步编排、变更流出口、打标引擎、订阅中心的核心服务。', x:372, y:76,  w:230, h:74, children:'backend' },
      { id:'outlet',  name:'变更流出口 + 权限', type:'service', meta:'契约 ∩ 主体 · 五道判定', desc:'快照/变更/回查的统一授权出口:列级、行级、密级、配额逐层裁剪。', x:372, y:172, w:230, h:74, children:'outlet' },
      { id:'tagengine', name:'打标引擎模块', type:'service', meta:'规则 / 任务 / 在线 / 流 / 批', desc:'打标任务与规则资产,在线求值与 v2 批/增执行体的登记入口。', x:372, y:268, w:230, h:74, children:'tag' },
      { id:'sync',    name:'数据接入与同步', type:'service', meta:'CDC / 全量 / 文件', desc:'sync 域:配置驱动的同步作业编排与执行状态管理。', x:622, y:76,  w:250, h:74 },
      { id:'datasub', name:'订阅与分发', type:'service', meta:'PULL API · token 鉴权', desc:'订阅方 schema/snapshot/changes 数据服务与导出任务。', x:622, y:172, w:250, h:74 },
      { id:'perm',    name:'权限体系', type:'domain', meta:'统一 ABAC · 策略中心 + PDP + Plan', desc:'数据权限统一控制模型:定义层完备、执行层六出口 PEP 切面。', x:622, y:268, w:250, h:74, children:'perm' },

      { id:'v2ctrl',  name:'v2 控制面', type:'service', meta:'outlet-service · 8095', desc:'锚点/起点/规划/租约/巡检/批阶段,批增两阶段的决策中心。', x:956, y:76,  w:282, h:74, children:'v2' },
      { id:'v2worker',name:'v2 计算面', type:'service', meta:'worker-service · 8096', desc:'单元运行器:契约裁剪 → 业务逻辑 → commitSync,异常进死信。', x:956, y:172, w:282, h:74 },
      { id:'spark',   name:'Spark 批执行体', type:'domain', meta:'tagengine-executor', desc:'批阶段:平台快照 API → 规则求值 → tag_fact 落湖。', x:956, y:268, w:282, h:74, children:'tag' },
      { id:'flink',   name:'Flink 流执行体', type:'domain', meta:'dcp-tagstream', desc:'增量段:从播种 offset 消费 → 求值 → Redis + tag_fact_view。', x:956, y:360, w:282, h:74 },

      { id:'mysql', name:'MySQL 元库',   type:'data',  meta:'8.0 · dcp 库',   desc:'元数据/任务/契约/标签/权限全量持久化。', x:48,  y:506, w:162, h:72 },
      { id:'kafka', name:'Kafka',        type:'infra', meta:'KRaft 3 节点',   desc:'变更流总线与任务事件管道。',             x:218, y:506, w:162, h:72 },

      { id:'redis', name:'Redis',        type:'infra', meta:'在线层',        desc:'在线标签 hash、缓存与 TTL。',            x:558, y:506, w:162, h:72 },
      { id:'minio', name:'MinIO',        type:'data',  meta:'对象存储',      desc:'文件数据与湖底层存储。',                 x:728, y:506, w:162, h:72 },
      { id:'lake',  name:'Iceberg 湖',   type:'data',  meta:'catalog demo',  desc:'tag_fact 与同步数据落地,支持时间旅行。', x:898, y:506, w:162, h:72 },
      { id:'neo4j', name:'Neo4j 血缘',   type:'data',  meta:'图谱',          desc:'逻辑表血缘与影响分析。',                 x:1068,y:506, w:162, h:72 }
    ],
    edges: [
      { id:'r1',  from:'web',      to:'backend',  label:'HTTPS REST' },
      { id:'r2',  from:'agent',    to:'backend',  label:'心跳/命令', type:'async' },
      { id:'r3',  from:'seatunnel',to:'lake',     label:'同步写湖', type:'async' },
      { id:'r4',  from:'backend',  to:'mysql',    label:'持久化' },
      { id:'r5',  from:'backend',  to:'redis',    label:'在线标签' },
      { id:'r6',  from:'backend',  to:'neo4j',    label:'血缘' },
      { id:'r7',  from:'backend',  to:'v2ctrl',   label:'登记桥 deploy-v2', children:'tag', desc:'打标任务发布后,登记成 v2 消费任务(流扫描 + 契约/账号预置)。' },

/* =========================================================
 * 2. DOM & 状态
 * =======================================================*/
const stageEl      = document.getElementById('stage');
const canvasFit    = document.getElementById('canvasFit');
const canvasEl     = document.getElementById('canvas');
const groupsEl     = document.getElementById('groups');
const nodesEl      = document.getElementById('nodes');
const labelsEl     = document.getElementById('labels');
const linksEl      = document.getElementById('links');
const breadcrumbEl = document.getElementById('breadcrumb');
const titleEl      = document.getElementById('viewTitle');
const subEl        = document.getElementById('viewSub');
const detailEl     = document.getElementById('detail');
const detailBadge  = document.getElementById('detailBadge');
const detailName   = document.getElementById('detailName');
const detailDesc   = document.getElementById('detailDesc');
const detailPath   = document.getElementById('detailPath');
const detailHint   = document.getElementById('detailHint');

let stack = [{ label: '数据采集平台', key: 'root' }];
let nodeEls = new Map();
let nodeData = new Map();
let edgeRefs = new Map();
let currentEdges = [];
let currentBounds = { w: 800, h: 600 };

const currentView = () => VIEWS[stack[stack.length - 1].key];

/* =========================================================
 * 3. 渲染
 * =======================================================*/
function render() {
  const view = currentView();

  titleEl.textContent = view.title;
  subEl.textContent   = view.subtitle || '';
  renderBreadcrumb();
  closeDetail();

  nodeEls.clear();
  nodeData.clear();
  edgeRefs.clear();
  groupsEl.innerHTML = '';
  nodesEl.innerHTML  = '';
  labelsEl.innerHTML = '';
  linksEl.innerHTML  = '';

  (view.groups || []).forEach(g => {
    const el = document.createElement('div');
    el.className = 'group';
    el.style.cssText = `left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;`;
    const label = document.createElement('span');
    label.className = 'group-label';
    label.textContent = g.name;
    el.appendChild(label);
    groupsEl.appendChild(el);
  });

  view.nodes.forEach((n, i) => {
    const el = createNodeEl(n, i);
    nodesEl.appendChild(el);
    nodeEls.set(n.id, el);
    nodeData.set(n.id, n);
  });

  currentEdges = view.edges || [];
  drawEdges(view);

  fitCanvas(view);
}

function fitCanvas(view) {
  let maxX = 0, maxY = 0;
  (view.groups || []).forEach(g => {
    maxX = Math.max(maxX, g.x + g.w);
    maxY = Math.max(maxY, g.y + g.h);
  });
  view.nodes.forEach(n => {
    maxX = Math.max(maxX, n.x + n.w);
    maxY = Math.max(maxY, n.y + n.h);
  });
  const contentW = maxX + 34;
  const contentH = maxY + 34;
  currentBounds = { w: contentW, h: contentH };

  const availW = Math.max(360, stageEl.clientWidth  - 56);
  const availH = Math.max(280, stageEl.clientHeight - 56);

  let scale = Math.min(
    (availW * 0.96) / contentW,
    (availH * 0.96) / contentH
  );
  scale = Math.max(0.4, Math.min(scale, 1.75));

  canvasEl.style.width  = contentW + 'px';
  canvasEl.style.height = contentH + 'px';
  canvasEl.style.transform = `scale(${scale})`;

  canvasFit.style.width  = (contentW * scale) + 'px';
  canvasFit.style.height = (contentH * scale) + 'px';
}

function createNodeEl(node, index) {
  const meta = TYPE_META[node.type] || TYPE_META.service;

  const el = document.createElement('div');
  el.className = 'node' + (node.children ? ' drillable' : '');
  el.style.cssText =
    `left:${node.x}px;top:${node.y}px;width:${node.w}px;height:${node.h}px;--c:${meta.color};` +
    `animation-delay:${Math.min(index * 22, 320)}ms;`;
  el.dataset.id = node.id;

  if (node.h < 68) el.classList.add('compact');

  const nameEl = document.createElement('div');
  nameEl.className = 'node-name';
  nameEl.textContent = node.name;
  el.appendChild(nameEl);

  if (node.meta) {
    const m = document.createElement('div');
    m.className = 'node-meta';
    m.textContent = node.meta;
    el.appendChild(m);
  }

  if (node.children) {
    const badge = document.createElement('span');
    badge.className = 'node-drill';
    badge.textContent = '↗';
    el.appendChild(badge);
    el.addEventListener('click', e => { e.stopPropagation(); drillDown(node); });
  } else {
    el.addEventListener('click', e => { e.stopPropagation(); showNodeDetail(node); });
  }

  el.addEventListener('mouseenter', () => highlightNode(node.id));
  el.addEventListener('mouseleave', clearHighlight);

  return el;
}

/* =========================================================
 * 4. 连线绘制
 * =======================================================*/
function drawEdges(view) {
  linksEl.setAttribute('viewBox', `0 0 ${currentBounds.w} ${currentBounds.h}`);
  linksEl.setAttribute('width',  currentBounds.w);
  linksEl.setAttribute('height', currentBounds.h);
  linksEl.style.width  = currentBounds.w + 'px';
  linksEl.style.height = currentBounds.h + 'px';
  linksEl.innerHTML = DEFS;

  const map = {};
  view.nodes.forEach(n => map[n.id] = n);

  currentEdges.forEach(edge => {
    const a = map[edge.from];
    const b = map[edge.to];
    if (!a || !b) return;

    const pts = cleanPts(buildRoute(a, b));
    if (pts.length < 2) return;
    const d = roundedPath(pts);

    const type      = edge.type || 'sync';
    const fromType  = a.type;
    const baseColor = TYPE_META[fromType] ? TYPE_META[fromType].color : HL_COLOR;
    const color     = type === 'async' ? ASYNC_COLOR : baseColor;
    const markerId  = type === 'async' ? 'arw-async' : ('arw-' + fromType);

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'edge');
    g.dataset.id = edge.id;

    const hit = document.createElementNS(NS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'link-hit');

    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'link' + (type === 'async' ? ' async' : ''));
    p.style.stroke = hexToRgba(color, type === 'async' ? .58 : .45);
    p.setAttribute('marker-end', `url(#${markerId})`);

    const f = document.createElementNS(NS, 'path');
    f.setAttribute('d', d);
    f.setAttribute('class', 'link-flow');
    f.style.stroke = color;

    g.append(hit, p, f);
    linksEl.appendChild(g);

    let labelEl = null;
    if (edge.label) {
      const mid = pointAt(pts, .5);
      labelEl = document.createElement('div');
      labelEl.className = 'link-label' + (edge.children ? ' drillable' : '');
      labelEl.style.left = mid.x.toFixed(1) + 'px';
      labelEl.style.top  = mid.y.toFixed(1) + 'px';
      labelEl.style.setProperty('--lc', color);
      labelEl.textContent = edge.label;
      labelsEl.appendChild(labelEl);
    }

    const ref = { g, hit, p, f, labelEl, edge, color, markerId, type };
    edgeRefs.set(edge.id, ref);

    const enter = () => highlightEdge(edge.id);
    const leave = () => clearHighlight();
    const click = e => { e.stopPropagation(); onEdgeClick(edge); };

    [hit, labelEl].forEach(target => {
      if (!target) return;
      target.addEventListener('mouseenter', enter);
      target.addEventListener('mouseleave', leave);
      target.addEventListener('click', click);
    });
  });
}

function buildRoute(a, b) {
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const dx = bcx - acx, dy = bcy - acy;
  const horizontal = Math.abs(dx) >= Math.abs(dy);

  if (horizontal) {
    const goRight = dx >= 0;
    const sx = goRight ? a.x + a.w : a.x;
    const ex = goRight ? b.x : b.x + b.w;
    if (Math.abs(acy - bcy) < 1) return [{x:sx,y:acy},{x:ex,y:bcy}];
    const mx = (sx + ex) / 2;
    return [{x:sx,y:acy},{x:mx,y:acy},{x:mx,y:bcy},{x:ex,y:bcy}];
  } else {
    const goDown = dy >= 0;
    const sy = goDown ? a.y + a.h : a.y;
    const ey = goDown ? b.y : b.y + b.h;
    if (Math.abs(acx - bcx) < 1) return [{x:acx,y:sy},{x:bcx,y:ey}];
    const my = (sy + ey) / 2;
    return [{x:acx,y:sy},{x:acx,y:my},{x:bcx,y:my},{x:bcx,y:ey}];
  }
}

function cleanPts(pts) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i], q = out[out.length - 1];
    if (Math.abs(p.x - q.x) > .6 || Math.abs(p.y - q.y) > .6) out.push(p);
  }
  return out;
}

function roundedPath(pts) {
  const r = 10;
  if (pts.length < 2) return '';
  if (pts.length === 2) return `M${pts[0].x},${pts[0].y} L${pts[1].x},${pts[1].y}`;

  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const prev = pts[i-1], cur = pts[i], next = pts[i+1];
    const v1x = cur.x - prev.x, v1y = cur.y - prev.y;
    const v2x = next.x - cur.x, v2y = next.y - cur.y;
    const l1 = Math.hypot(v1x, v1y) || 1;
    const l2 = Math.hypot(v2x, v2y) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const p1x = cur.x - v1x / l1 * rr, p1y = cur.y - v1y / l1 * rr;
    const p2x = cur.x + v2x / l2 * rr, p2y = cur.y + v2y / l2 * rr;
    d += ` L${p1x.toFixed(1)},${p1y.toFixed(1)} Q${cur.x},${cur.y} ${p2x.toFixed(1)},${p2y.toFixed(1)}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last.x},${last.y}`;
}

function pointAt(pts, t) {
  let total = 0;
  const segs = [];
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
    segs.push(l); total += l;
  }
  let target = total * t;
  for (let i = 0; i < segs.length; i++) {
    if (target <= segs[i]) {
      const k = segs[i] ? target / segs[i] : 0;
      return {
        x: pts[i].x + (pts[i+1].x - pts[i].x) * k,
        y: pts[i].y + (pts[i+1].y - pts[i].y) * k
      };
    }
    target -= segs[i];
  }
  return pts[pts.length - 1];
}

/* =========================================================
 * 5. 高亮
 * =======================================================*/
function setEdgeState(id, state) {
  const ref = edgeRefs.get(id);
  if (!ref) return;
  const { p, g, edge, color, markerId, type, labelEl } = ref;

  g.classList.toggle('active', state === 'hl');
  p.classList.toggle('dim', state === 'dim');
  p.style.strokeWidth = state === 'hl' ? 2.5 : 1.7;

  if (state === 'hl') {
    p.style.stroke = color;
    p.setAttribute('marker-end', 'url(#arw-hl)');
  } else {
    p.style.stroke = hexToRgba(color, type === 'async' ? .58 : .45);
    p.setAttribute('marker-end', `url(#${markerId})`);
  }

  if (labelEl) {
    labelEl.classList.toggle('dim', state === 'dim');
    labelEl.classList.toggle('hl',   state === 'hl');
  }
}

function highlightNode(id) {
  const related = new Set([id]);
  currentEdges.forEach(e => {
    if (e.from === id || e.to === id) { related.add(e.from); related.add(e.to); }
  });
  nodeEls.forEach((el, nid) => el.classList.toggle('dim', !related.has(nid)));
  edgeRefs.forEach((ref, eid) => {
    const hit = ref.edge.from === id || ref.edge.to === id;
    setEdgeState(eid, hit ? 'hl' : 'dim');
  });
}

function highlightEdge(id) {
  const ref = edgeRefs.get(id);
  if (!ref) return;
  const { from, to } = ref.edge;

  nodeEls.forEach((el, nid) => {
    el.classList.toggle('dim', nid !== from && nid !== to);
  });
  edgeRefs.forEach((r, eid) => {
    setEdgeState(eid, eid === id ? 'hl' : 'dim');
  });
}

function clearHighlight() {
  nodeEls.forEach(el => el.classList.remove('dim'));
  edgeRefs.forEach((r, eid) => setEdgeState(eid, 'normal'));
}

/* =========================================================
 * 6. 点击行为
 * =======================================================*/
function onEdgeClick(edge) {
  if (edge.children) {
    stack.push({ label: edge.label || '连接详情', key: edge.children });
    render();
    stageEl.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  } else {
    showEdgeDetail(edge);
  }
}

/* =========================================================
 * 7. 下钻 & 面包屑
 * =======================================================*/
function drillDown(node) {
  if (!node.children) return;
  stack.push({ label: node.name, key: node.children });
  render();
  stageEl.scrollTo({ top: 0, left: 0, behavior: 'auto' });
}

function jumpTo(index) {
  stack = stack.slice(0, index + 1);
  render();
  stageEl.scrollTo({ top: 0, left: 0, behavior: 'auto' });
}

function renderBreadcrumb() {
  breadcrumbEl.innerHTML = '';
  stack.forEach((item, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      breadcrumbEl.appendChild(sep);
    }
    const btn = document.createElement('button');
    btn.className = 'crumb' + (i === stack.length - 1 ? ' active' : '');
    btn.textContent = item.label;
    if (i < stack.length - 1) btn.addEventListener('click', () => jumpTo(i));
    breadcrumbEl.appendChild(btn);
  });
}

/* =========================================================
 * 8. 详情面板
 * =======================================================*/
function showNodeDetail(node) {
  const meta = TYPE_META[node.type] || TYPE_META.service;
  detailBadge.textContent = meta.label;
  detailBadge.style.color = meta.color;
  detailBadge.style.background = hexToRgba(meta.color, .12);

  detailName.textContent = node.name;
  detailDesc.textContent = node.desc || node.meta || '暂无更多说明。';
  detailPath.hidden = true;
  detailHint.textContent = node.children ? '点击带 ↗ 的元素可继续下钻' : '这是最底层模块';
  detailEl.hidden = false;
}

function showEdgeDetail(edge) {
  const fromName = (nodeData.get(edge.from) || {}).name || edge.from;
  const toName   = (nodeData.get(edge.to)   || {}).name || edge.to;
  const isAsync  = edge.type === 'async';

  detailBadge.textContent = isAsync ? '异步消息' : '调用关系';
  detailBadge.style.color = isAsync ? ASYNC_COLOR : HL_COLOR;
  detailBadge.style.background = hexToRgba(isAsync ? ASYNC_COLOR : HL_COLOR, .12);

  detailName.textContent = edge.label || `${fromName} → ${toName}`;
  detailDesc.textContent = edge.desc || '两个模块之间的依赖关系。';

  detailPath.hidden = false;
  detailPath.innerHTML = `<b>${escapeHtml(fromName)}</b> → <b>${escapeHtml(toName)}</b>`;

  detailHint.textContent = edge.children ? '点击该连线可继续下钻' : '点击其他元素查看更多';
  detailEl.hidden = false;
}

function closeDetail() { detailEl.hidden = true; }

document.getElementById('detailClose').addEventListener('click', closeDetail);
stageEl.addEventListener('click', () => { clearHighlight(); closeDetail(); });
detailEl.addEventListener('click', e => e.stopPropagation());

/* =========================================================
 * 9. 工具函数
 * =======================================================*/
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

/* =========================================================
 * 10. 窗口自适应
 * =======================================================*/
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const view = currentView();
    if (!view) return;
    fitCanvas(view);
  }, 120);
});

/* =========================================================
 * 11. 启动
 * =======================================================*/
render();
</script>
