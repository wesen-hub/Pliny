# MySQL 持久化 profile：mvn spring-boot:run -Dspring-boot.run.profiles=jdbc
# 或 java -jar perm-admin.jar --spring.profiles.active=jdbc
# 需先有 MySQL 8.0（演示用 Docker：docker run -d --name perm-mysql -p 13306:3306 \
#   -e MYSQL_ROOT_PASSWORD=perm -e MYSQL_DATABASE=perm_admin mysql:8.0）
spring:
  datasource:
    url: jdbc:mysql://${PERM_MYSQL_HOST:127.0.0.1}:${PERM_MYSQL_PORT:13306}/perm_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${PERM_MYSQL_USER:root}
    password: ${PERM_MYSQL_PASSWORD:perm}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 演示级建表（幂等 IF NOT EXISTS）；正式形态升级 Flyway 版本化迁移
      mode: always
      schema-locations: classpath:schema.sql

perm:
  storage: jdbc
  # 元数据目录随 jdbc 持久化（perm_attr_meta / perm_tag_meta）
  metadata:
    source: jdbc
