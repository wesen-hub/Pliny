server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # hash 路由下所有路径回落到 index.html（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 文件名，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反代（compose 网络内服务名；本地 vite 开发不受此配置影响，走 vite proxy）
    # resolver 127.0.0.11 = Docker 内置 DNS；proxy_pass 用变量强制运行时解析，
    # 避免上游容器重启换 IP 后 nginx 缓存旧地址导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pdp_upstream http://perm-pdp:8081;
    set $admin_upstream http://perm-admin:8082;
    # PDP 判定与 PDP 管理面 → perm-pdp:8081
    location /api/v1/authorize {
        proxy_pass $pdp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/admin {
        proxy_pass $pdp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 策略 CRUD / 状态流转 / 发布历史 → perm-admin:8082
    location /api/v1/ {
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
