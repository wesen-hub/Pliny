server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: backend
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dcp}
    sentinel:
      eager: false
  config:
    import:
      # M1: 配置中心外迁(optional: Nacos 不可达时回退本地 yml, 本地开发/降级不阻断启动)
      - optional:nacos:dcp-common.yml
      - optional:nacos:${spring.application.name}.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP_ID:dcp-sync-demo}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      ack-mode: manual_immediate
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /api/actuator
  health:
    mail:
      enabled: false
    # 血缘图库 Neo4j 已迁出至 asset-service(N12), backend 不再持有 neo4j 依赖

logging:
  level:
    com.dcp: info

dcp:
  # dcp-worker 执行体服务(方案 §9:TaskSpec 提交/注销/扩容建议消费均走 REST,不再直连 etcd)
  worker:
    url: ${DCP_WORKER_URL:http://127.0.0.1:8097}
  # 自动扩容上限系数:maxPartitions = 建表分区数 × 系数(演示缺省 2)
  scheduler:
    sync-max-factor: ${DCP_SCHEDULER_SYNC_MAX_FACTOR:2}
  # 变更流出口已迁出至 delivery-service(N10), 相关配置见 delivery-service/src/main/resources/application.yml
  enc-key: ${PLATFORM_ENC_KEY}
  jwt-secret: ${JWT_SECRET}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:2}
  # M4: 控制面注解限流规则(全内嵌, 格式 "资源名:QPS"; 资源名=@SentinelResource value)
  sentinel:
    flow-rules:
      - "api-auth-login:20"      # 登录防爆破(与网关限流双保险)
      - "api-cdc-st-control:20"  # CDC 启停控制
  # 执行引擎: seatunnel (默认, 需要 seatunnel 容器) | light (轻量 JDBC 兑底)
  engine:
    type: ${ENGINE_TYPE:seatunnel}
    # 执行并发上限（对应设计文档 20 并发）
    max-concurrency: ${ENGINE_MAX_CONCURRENCY:20}
    # 批量写入行数
    batch-size: ${ENGINE_BATCH_SIZE:1000}
    # 源端 fetchSize
    fetch-size: ${ENGINE_FETCH_SIZE:1000}
    # SeaTunnel 状态轮询间隔
    poll-interval-ms: ${ENGINE_POLL_INTERVAL_MS:10000}
  seatunnel:
    url: ${SEATUNNEL_URL:http://seatunnel:8081}
  # V3 同步链路(P0):数据面目标库(2026-09-14 起默认指向新 TiDB 集群 dcp-outlet-tidb1:4000/target_db)
  sync:
    # 消费端由调度框架托管(ns=sync;false = 旧链路消费组自治)
    framework:
      enabled: ${SYNC_FRAMEWORK_ENABLED:true}
    # 消费端监听的 topic(逗号分隔; CDC 演示链路用 dcp.order.cdc)
    topics: ${SYNC_TOPICS:dcp.order.demo,dcp.order.cdc}
    target:
      url: ${SYNC_TARGET_URL:jdbc:mysql://dcp-outlet-tidb1:4000/target_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
      username: ${SYNC_TARGET_USERNAME:root}
      password: ${SYNC_TARGET_PASSWORD}
    # SeaTunnel CDC 采集端(告警落库用的元库地址, 从 seatunnel 容器内可达; 新方案: 主键修改/缺列告警写 sync_alert)
    cdc-st:
      alert-db-url: ${SYNC_CDCST_ALERT_DB_URL:jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      alert-db-user: ${SYNC_CDCST_ALERT_DB_USER:root}
      alert-db-password: ${SYNC_CDCST_ALERT_DB_PASSWORD}
      kafka-bootstrap: ${SYNC_CDCST_KAFKA_BOOTSTRAP:dcp-outlet-kafka1:9092,dcp-outlet-kafka2:9092,dcp-outlet-kafka3:9092}
      # 待办1: job 丢失巡检自动 restore(H14 实证 master 宕机后 job 消失不自动恢复);
      # restore 前先确认引擎可达, 单任务失败退避 5 分钟
      watchdog:
        enabled: ${SYNC_CDCST_WATCHDOG_ENABLED:true}
        interval-ms: ${SYNC_CDCST_WATCHDOG_INTERVAL_MS:60000}
    demo:
      topic: ${SYNC_DEMO_TOPIC:dcp.order.demo}
      concurrency: ${SYNC_DEMO_CONCURRENCY:2}
    # 消费-写库解耦(有界队列 + 共享写线程池攒批), 见 BatchWriteService
    buffer:
      queue-capacity: ${SYNC_BUFFER_QUEUE_CAPACITY:2000}
      batch-size: ${SYNC_BUFFER_BATCH_SIZE:500}
      batch-timeout-ms: ${SYNC_BUFFER_BATCH_TIMEOUT_MS:100}
      write-threads: ${SYNC_BUFFER_WRITE_THREADS:4}
      commit-interval-ms: ${SYNC_BUFFER_COMMIT_INTERVAL_MS:5000}
      drain-per-queue: ${SYNC_BUFFER_DRAIN_PER_QUEUE:200}
  # 事件接入(入站)底座任务登记桥(P3): 入站消费已迁出至底座任务(kafka-ingest@1.0.0,
  # dcp-outlet-rt 执行), backend 只负责登记与状态探针; 本阶段只登记不激活(部署方案阶段 resume)
  ingest:
    outlet-control-url: ${OUTLET_CONTROL_URL:http://127.0.0.1:8095}
    # 底座容器内可达的元库地址(seq_counter/logical_table/dlt_message; 与 cdc-st 段同模式)
    meta-jdbc-url: ${INGEST_META_JDBC_URL:jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    meta-user: ${INGEST_META_USER:root}
    meta-password: ${INGEST_META_PASSWORD}
    # 底座容器内可达的平台栈 Kafka(入站 topic dcp.in.{表} 与信封流 dcp.{表} 所在)
    kafka-bootstrap: ${INGEST_KAFKA_BOOTSTRAP:dcp-kafka:9092}
  lakesync:
    # 湖增量底座任务登记桥(与 ingest 同模式; 任务执行体=dcp-outlet-rt 装载 dcp-lake-task jar)
    outlet-control-url: ${OUTLET_CONTROL_URL:http://127.0.0.1:8095}
    # 底座容器内可达的元库地址(logical_table 业务键读 / dlt_message 落库; 与 ingest 同库同视角)
    meta-jdbc-url: ${LAKESYNC_META_JDBC_URL:jdbc:mysql://mysql:3306/dcp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    meta-user: ${LAKESYNC_META_USER:root}
    meta-password: ${LAKESYNC_META_PASSWORD}
    # 批作业 runner 与湖增量任务的 catalog/s3 同源配置(见 compose DCP_LAKESYNC_CATALOG_* env)
    runner-mode: ${LAKESYNC_RUNNER_MODE:simulate}
    catalog:
      # rest = RESTCatalog(Polaris 等 REST 服务端); hadoop = HadoopCatalog 直连 S3(需 s3 scheme 的 fs 注册);
      # jdbc = JdbcCatalog(元数据存 RDS, 免 Hadoop fs; 三机无 polaris 场景下湖增量标准路径)
      type: ${DCP_LAKESYNC_CATALOG_TYPE:rest}
      name: ${DCP_LAKESYNC_CATALOG_NAME:demo}
      jdbc-uri: ${DCP_LAKESYNC_CATALOG_JDBC_URI:}
      uri: ${DCP_LAKESYNC_CATALOG_URI:http://dcp-polaris:8181/api/catalog}
      warehouse: ${DCP_LAKESYNC_CATALOG_WAREHOUSE:demo}
      namespace: ${DCP_LAKESYNC_CATALOG_NAMESPACE:dcp}
  alarm:
    # 默认告警 webhook（钉钉/企微），可空
    default-webhook: ${ALARM_WEBHOOK:}

